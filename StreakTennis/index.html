// ⚠️⚠️ LINJEN, DER IKKE MAA FJERNES.
// Vi kan slette filen. Vi kan IKKE forhindre et skaermbillede. Staar der
// kun \u00abslettes naar den er set\u00bb, har vi lovet noget, vi ikke kan holde —
// og det er praecis den slags, Julie skal kunne staa inde for.
function _billedLoefte(EN) {
  if (!_bilEmneNu() || !_maaBillede()) return "";
  const b = (S.bilBesked && S.bilEmne === _bilEmneNu()) ? S.bilBesked : null;
  return (b ? '<p class="lille" style="margin:6px 2px 0;color:' +
      (b.fejl ? "var(--tabt)" : "var(--vundet)") + '">' + esc(b.t) + '</p>' : '') +
    (S.bilVisBesked ? '<p class="lille" style="margin:6px 2px 0;color:var(--tabt)">' + esc(S.bilVisBesked.t) + '</p>' : '') +
    '<p class="lille" style="margin:6px 2px 0;opacity:.6;font-size:10.5px;line-height:1.45">\ud83d\udcf7 ' + (EN
      ? "A picture can be seen once and is deleted then. We do not keep it \u2014 but we cannot stop a screenshot."
      : "Et billede kan ses \u00e9n gang og slettes s\u00e5. Vi gemmer det ikke \u2014 men vi kan ikke forhindre et sk\u00e6rmbillede.") + '</p>';
}

// ⭐⭐ v4.43.0 · TO NYE VALG, SÅ RUMMET KAN VÆRE EN FLADE:
//   `foer` — det, der hører til samtalen uden at være en besked
//            (rummets live-kort, de fire tal og stigen). Det tegnes INDE
//            i rullekassen, over beskederne.
//   `tom`  — teksten, når der ikke er nogen beskeder. Før stod den uden
//            for listen, og så forsvandt hovedet i et tomt rum.
// ⚠️ Venne-chatten sender ingen af dem og opfører sig præcis som før.
function _snakListe(liste, p, EN) {
  const L = (liste || []).slice(-60);
  if (!L.length && !p.foer && !p.tom) return "";

  // ⭐⭐ LAEST-KVITTERINGEN regnes ud HER, ikke paa serveren.
  // Serveren sender ÉT tidsstempel — hvornaar modparten sidst saa
  // samtalen. Appen finder selv den sidste af MINE beskeder, der ligger
  // foer det tidspunkt. 400 raekker om et barns telefonvaner bliver til
  // ét tal (princip 17).
  const vl = p.venLaest ? Date.parse(p.venLaest) : 0;
  let laestId = null, sidsteMin = null;
  L.forEach(function (b) {
    if (!b.mig || b.art !== "t") return;
    sidsteMin = b.id;
    if (vl && Date.parse(b.tid) <= vl) laestId = b.id;
  });

  const P = p.pre;
  const knap = function (a, v, tekst, farve) {
    return '<button class="knap valg" style="flex:none;min-height:38px;padding:0 12px;font-size:12.5px' +
      (farve ? ';color:' + farve + ';border-color:' + farve : '') + '" data-a="' + a + '" data-v="' + v + '">' + tekst + '</button>';
  };
  const spoerg = function (tekst, jaA, jaTekst, nejA) {
    return '<div style="margin:4px 0 6px;padding:9px;border:1px dashed var(--kant);border-radius:12px;background:var(--kort)">' +
      '<p class="lille" style="margin:0 0 8px">' + tekst + '</p>' +
      '<div class="raekke"><button class="knap" style="min-height:44px;background:var(--tabt)" data-a="' + jaA + '">' + jaTekst + '</button>' +
      '<button class="knap valg" style="min-height:44px" data-a="' + nejA + '">' + (EN ? "Cancel" : "Fortryd") + '</button></div></div>';
  };

  // ⭐ Egen rullekasse. Foer laa samtalen frit ned ad siden og endte bag
  // bundbjaelken; nu bliver skrivefeltet staaende, og render() holder
  // rullen, hvor den var (se render).
  // ⚠️ Er der et spillerkort over samtalen, faar listen mindre plads —
  // ellers skubbes skrivefeltet ned bag bundbjaelken paa en lille telefon.
  // ⭐⭐ v4.34.0 · `fyld` = "du er i en flade, tag det, der er tilbage".
  // Venne-chatten er en HEL skaerm og saetter fyld. Rummet har en stige
  // og fire tal ovenover, som skal kunne rulle — det beholder sit loft.
  const hoejde = p.fyld ? null : (p.kort ? "34vh" : "46vh");
  let h = '<div id="snak-rul" style="display:flex;flex-direction:column;' +
    (hoejde ? "max-height:" + hoejde : "flex:1 1 auto;min-height:0") +
    ';overflow-y:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch">';
  // \u2b50\u2b50 v4.43.0 \u00b7 HOVEDET LIGGER I RULLEKASSEN, IKKE OVER DEN.
  // \u00c9n ruller \u2014 to ville sl\u00e5s om fingeren, og skrivefeltet skulle
  // stadig have en fast plads forneden. S\u00e5dan ruller stigen v\u00e6k af sig
  // selv, n\u00e5r man l\u00e6ser, og kommer tilbage, n\u00e5r man ruller op.
  if (p.foer) h += p.foer;
  if (!L.length) { h += (p.tom || ""); return h + '</div>'; }
  // \u2b50 v4.34.0 \u00b7 SAMTALEN HVILER PAA SKRIVEFELTET.
  // Med faa beskeder klistrede den foer op i toppen med et tomt hul
  // nedenunder. `margin-top:auto` skubber den ned, naar der er plads,
  // og goer ingenting, naar der ikke er.
  // \u26a0\ufe0f IKKE justify-content:flex-end \u2014 den klipper toppen af,
  // naar samtalen bliver laengere end kassen, og saa kan man ikke rulle
  // op til den aeldste besked.
  if (p.fyld) h += '<div style="display:flex;flex-direction:column;margin-top:auto">';
  let sidsteDag = "", sidsteAf = null;

  L.forEach(function (b, i) {
    const mig = !!b.mig;
    const id = esc(String(b.id));
    const dag = _dagPaa(b.tid, EN);

    if (dag && dag !== sidsteDag) {
      sidsteDag = dag; sidsteAf = null;
      h += '<div style="display:flex;justify-content:center;margin:10px 0 8px">' +
        '<span class="lille" style="margin:0;background:var(--kort);border:1px solid var(--kant);border-radius:99px;padding:3px 12px">' +
        esc(dag) + '</span></div>';
    }

    // ── EN REAKTION ER IKKE EN BESKED ────────────────────────────────
    // Den faar ingen boble. En 🔥 er et nik, ikke en saetning — og fem
    // nik i traek maa ikke fylde som fem beskeder.
    if (b.art === "r") {
      sidsteAf = null;
      const rValgt = p.valgtId === b.id;
      h += '<div ' + (b.id ? 'data-a="' + P + 'Vaelg" data-v="' + id + '" data-mig="' + (mig ? "1" : "0") + '" style="cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;' : 'style="') +
        'display:flex;align-items:center;gap:7px;margin:3px 0;justify-content:' + (mig ? "flex-end" : "flex-start") + '">' +
        '<span style="font-size:21px;line-height:1;flex:none">' + esc(b.tekst) + '</span>' +
        '<span class="lille" style="margin:0;opacity:.55">' + esc(b.fornavn) + ' \u00b7 ' + esc(_klokPaa(b.tid, EN)) + '</span>' +
        '</div>';
      // ⭐ Samme regel som boblen: handlingen kommer frem, naar man
      // trykker. En reaktion kan slettes, men aldrig rettes — en 🔥 er
      // ikke en saetning, man kan skrive om.
      if (rValgt && mig && b.id) {
        h += '<div style="display:flex;gap:6px;margin:2px 0 4px;justify-content:' + (mig ? "flex-end" : "flex-start") + '">' +
          knap(P + "SletSpoerg", id, "\ud83d\uddd1 " + (EN ? "Delete" : "Slet"), "var(--tabt)") + '</div>';
      }
      if (p.sletId === b.id) {
        h += spoerg(EN ? "Delete your reaction?" : "Slet din reaktion?", P + "SletJa", EN ? "Delete" : "Slet", P + "SletNej");
      }
      return;
    }

    // ── ET BILLEDE ER EN BESKED, IKKE ET ARKIV (v4.40.0) ─────────────
    // Boblen baerer ikke billedet — den baerer en DOER til det. Bytes
    // kommer foerst, naar man trykker, og kun én gang. Derfor er der
    // heller ingen forhaandsvisning: en forhaandsvisning ER at have set
    // det, og saa ville reglen vaere brudt, foer nogen roerte noget.
    if (b.art === "b") {
      sidsteAf = null;
      const bid = esc(String(b.tekst || ""));
      const st = String(b.billede || "vaek");
      const henter = S.bilVisHenter === String(b.tekst);
      const vaek = (st !== "klar");
      const linje = st === "set" ? (EN ? "Seen \u00b7 the picture is gone" : "Set \u00b7 billedet er v\u00e6k")
        : st === "vaek" ? (EN ? "The picture is gone" : "Billedet er v\u00e6k")
        : mig ? (EN ? "Sent \u00b7 not opened yet" : "Sendt \u00b7 ikke \u00e5bnet endnu")
        : (EN ? "Can be seen once" : "Kan ses \u00e9n gang");
      h += '<div style="display:flex;justify-content:' + (mig ? "flex-end" : "flex-start") + ';margin-top:7px">' +
        '<div style="max-width:82%;min-width:0;display:flex;flex-direction:column;align-items:' +
          (mig ? "flex-end" : "flex-start") + '">' +
        (!mig ? '<span class="lille" style="margin:0 0 3px 11px;color:var(--is);font-weight:700">' + esc(b.fornavn) + '</span>' : '') +
        '<div style="background:' + (mig ? "var(--grus)" : "var(--flade)") + ';border:1px solid ' +
          (vaek ? "var(--kant)" : (mig ? "var(--grus)" : "var(--is)")) +
          ';border-radius:16px;padding:9px 12px;' + (vaek ? "opacity:.6" : "") + '">' +
        '<div style="font-size:14.5px;font-weight:700;margin-bottom:2px">\ud83d\udcf7 ' +
          (EN ? "Picture" : "Billede") + '</div>' +
        '<div class="lille" style="margin:0">' + linje + '</div>' +
        (vaek ? '' :
          '<button class="knap" style="margin-top:7px;min-height:44px;padding:0 14px;background:var(--grus)" ' +
          'data-a="bilAabn" data-v="' + bid + '">' +
          (henter ? "\u23f3 \u2026" : (mig ? (EN ? "See it" : "Se det") : (EN ? "Open" : "\u00c5bn"))) + '</button>') +
        (!vaek && mig ?
          '<button class="knap valg" style="margin-top:5px;min-height:44px;padding:0 12px;font-size:12.5px;color:var(--tabt);border-color:var(--tabt)" ' +
          'data-a="bilTraekSpoerg" data-v="' + bid + '">\ud83d\uddd1 ' + (EN ? "Take back" : "Tr\u00e6k tilbage") + '</button>' : '') +
        '</div>' +
        '<span class="lille" style="margin:3px 3px 0;opacity:.6">' + esc(_klokPaa(b.tid, EN)) + '</span>' +
        (S.bilTraekId === String(b.tekst)
          ? spoerg(EN ? "Take the picture back? It is gone for good."
                      : "Tr\u00e6k billedet tilbage? Det er v\u00e6k for altid.",
                   "bilTraekJa", EN ? "Take back" : "Tr\u00e6k tilbage", "bilTraekNej")
          : '') +
        // ⚠️⚠️ FANGET AF PRØVEN: ⚑ SKAL OGSÅ STÅ PÅ EN «SET» BOBLE.
        // Første udkast viste kun ⚑ på et UÅBNET billede. Men i et rum med
        // fem er det netop DEN, der lige har åbnet, som ved, at der er noget
        // galt — og de fire andre har stadig deres åbning til gode. Kunne
        // han ikke anmelde bagefter, kunne han ikke beskytte dem.
        // (Er billedet allerede væk, svarer motoren 404, og intet sker.)
        (!mig && st !== "vaek"
          ? '<button class="knap valg" style="margin-top:4px;min-height:44px;padding:0 12px;font-size:12.5px;color:var(--tabt);border-color:var(--tabt)" data-a="bilAnmeld" data-v="' + bid + '">\u2691 ' + (EN ? "Report" : "Rapport\u00e9r") + '</button>'
          : '') +
        '</div></div>';
      return;
    }

    // ── GRUPPERING ───────────────────────────────────────────────────
    // Fem beskeder i traek fra samme person er ÉN ytring med fem linjer,
    // ikke fem overskrifter. Navn oeverst, klokkeslaet nederst.
    const jeg = mig ? "__mig__" : String(b.fornavn || "");
    const foerst = sidsteAf !== jeg;
    sidsteAf = jeg;
    const n = L[i + 1];
    const sidst = !n || !!n.mig !== mig || (n.mig ? "__mig__" : String(n.fornavn || "")) !== jeg
      || _dagPaa(n.tid, EN) !== dag || n.art === "r";

    const R = "16px", lil = "5px";
    const hj = mig
      ? R + " " + R + " " + (sidst ? lil : R) + " " + R
      : R + " " + R + " " + R + " " + (sidst ? lil : R);

    h += '<div style="display:flex;justify-content:' + (mig ? "flex-end" : "flex-start") + ';margin-top:' + (foerst ? "7px" : "2px") + '">';
    h += '<div style="max-width:82%;min-width:0;display:flex;flex-direction:column;align-items:' + (mig ? "flex-end" : "flex-start") + '">';

    // Navnet staar kun over det foerste i en gruppe — og aldrig over mine
    // egne: de er blaa og staar til hoejre, det er nok.
    if (foerst && !mig) {
      h += '<span class="lille" style="margin:0 0 3px 11px;color:var(--is);font-weight:700">' + esc(b.fornavn) + '</span>';
    }

    if (p.retId === b.id) {
      // Rettelsen sker i boblens sted, saa man kan se hvor man er.
      h += '<div style="width:100%;background:var(--kort);border:1px solid var(--guld);border-radius:' + R + ';padding:9px 11px">' +
        '<input value="' + esc(p.retUdkast || "") + '" data-felt="' + P + 'RetUdkast" maxlength="140">' +
        '<div class="raekke" style="margin-top:7px">' +
        '<button class="knap" style="min-height:44px;background:var(--grus)" data-a="' + P + 'RetGem">' + (EN ? "Save" : "Gem") + '</button>' +
        '<button class="knap valg" style="min-height:44px" data-a="' + P + 'RetFortryd">' + (EN ? "Cancel" : "Fortryd") + '</button></div></div>';
    } else {
      // ⭐ Handlingerne gemmer sig, til man trykker. Foer stod ✏️ og 🗑
      // paa HVER besked hele tiden — det var halvdelen af rodet.
      h += '<div data-a="' + P + 'Vaelg" data-v="' + id + '" data-mig="' + (mig ? "1" : "0") + '"' +
        ' style="cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;background:' +
        (mig ? "var(--grus)" : "var(--flade)") + ';color:var(--kridt);border:1px solid ' +
        (mig ? "var(--grus)" : "var(--kant)") + ';border-radius:' + hj +
        ';padding:8px 12px;font-size:14.5px;line-height:1.36;word-break:break-word;white-space:pre-wrap">' +
        esc(b.tekst) + '</div>';
    }

    // ── FODEN: klokkeslaet, rettet-maerket, leveret/laest ─────────────
    if (sidst || b.id === laestId) {
      const d = [_klokPaa(b.tid, EN)];
      if (b.rettet) d.push(EN ? "edited" : "rettet");
      if (mig) {
        if (b.id === laestId) d.push((EN ? "Read " : "L\u00e6st ") + _klokPaa(p.venLaest, EN));
        else if (b.id === sidsteMin) d.push(EN ? "Delivered" : "Leveret");
      }
      h += '<span class="lille" style="margin:3px 3px 0;opacity:.6">' + esc(d.join(" \u00b7 ")) + '</span>';
    }

    // ── VALGT: handlingerne foldes ud under boblen ────────────────────
    if (p.valgtId === b.id && p.retId !== b.id) {
      h += '<div style="display:flex;gap:6px;margin:5px 0 2px;flex-wrap:wrap;justify-content:' + (mig ? "flex-end" : "flex-start") + '">' +
        (mig && b.id ? knap(P + "RetAabn", id, "\u270f\ufe0f " + (EN ? "Edit" : "Ret")) +
                       knap(P + "SletSpoerg", id, "\ud83d\uddd1 " + (EN ? "Delete" : "Slet"), "var(--tabt)") : "") +
        (!mig && b.id ? knap(P + "AnmeldSpoerg", id, "\u2691 " + (EN ? "Report" : "Rapport\u00e9r"), "var(--tabt)") : "") +
        '</div>';
    }

    if (p.sletId === b.id) {
      h += spoerg(EN
        ? "Delete your message? It is gone for " + (p.alle ? "everyone" : "both of you") + " \u2014 and cannot be undone."
        : "Slet din besked? Den er v\u00e6k for " + (p.alle ? "alle" : "jer begge") + " \u2014 og kan ikke fortrydes.",
        P + "SletJa", EN ? "Delete" : "Slet", P + "SletNej");
    }
    if (p.anmeldId === b.id) {
      h += spoerg(EN
        ? "Report this message? It is hidden for " + (p.alle ? "the whole room" : "both of you") + " right away and reviewed by the platform."
        : "Rapport\u00e9r beskeden? Den skjules for " + (p.alle ? "hele rummet" : "jer begge") + " med det samme og gennemses af platformen.",
        P + "AnmeldJa", EN ? "Report" : "Rapport\u00e9r", P + "AnmeldNej");
    }

    h += '</div></div>';
  });

  if (p.fyld) h += '</div>';
  h += '</div>';
  return h;
}

// ⭐⭐ v4.26.0 · BILLED-STRIMLEN. Samme komponent paa en kamp og paa et
// pas — ellers ville de to komme til at opfoere sig forskelligt, og et
// billede paa en traening ville faa andre regler end et paa en kamp.
//
// ⚠️ HELE POINTEN: denne funktion kaldes KUN fra en kamp og fra et pas.
// Der findes ikke et tredje sted i appen, hvor den kan kaldes fra.
// ⚠️⚠️ FANGET AF PROEVEN: EN KAMP HAR INGEN ID.
// `rensKamp` gemmer kun spillets egne felter, og listen sorteres efter dato.
// Bandt vi billedet til pladsen i listen, ville det hoppe over paa en anden
// kamp, saa snart en kamp blev slettet eller tilfoejet. Et billede af Oskar
// ville pludselig haenge paa en andens kamp.
//
// At give kampe et id ville aendre lagerformatet seks dage foer pilotstart.
// I stedet udledes en STABIL noegle af kampens EGET indhold: dato,
// modstander og resultat. Den er den samme hver gang, uanset hvordan
// listen sorteres, og uanset hvad der ellers slettes.
function _kampNoegle(k, i) {
  try {
    const raa = String(k.dato || "") + "|" + String(k.modstander || "") + "|" + String(k.resultat || "");
    let h = 5381;
    for (let n = 0; n < raa.length; n++) h = ((h * 33) ^ raa.charCodeAt(n)) >>> 0;
    return "k" + String(k.dato || "").replace(/[^0-9]/g, "") + "-" + h.toString(36);
  } catch (_e) { return "k" + i; }
}

// Maa DENNE telefon overhovedet laegge et billede? Samme hegn som resten:
// har man aldrig raakt ud, rejser der intet (O2-loeftet), og der spoerges
// ikke om noget her — der laeses kun.
function _maaBillede() {
  if (S.rolle === "familie" || !S.spillerNoegle) return false;
  if (S.portStatus) return !!S.portStatus.kendt && S.portStatus.status === "godkendt";
  try { return lager.hent("sai-inviteret") === "1"; } catch (_e) { return false; }
}

// ⭐⭐ v4.40.0 · DE ENESTE TO STEDER, HVOR NAVNENE OVERSAETTES.
//
// ⚠️⚠️ motorens "snak" = VENNE-chatten · appens "snak" = RUMMETS chat.
// Ordene peger modsat, og det er en faelde, der kun kan undgaas ved at
// have ét sted, hvor oversaettelsen staar. Det er her.
//
//   skaerm S.tab = "chat"     → S.chatVen  (16 hex) → motor { ven }   → emne_type "snak"
//   skaerm S.tab = "rumsnak"  → S.snakRum  (uuid)   → motor { rum }   → emne_type "rum"
//
// ⭐ Og bemaerk HVORFOR appen ikke selv kan regne adressen: telefonen
// holder ALDRIG et andet barns spillernoegle. Den har kun et haandtag.
// Adressen udledes derfor paa serveren, af noegler kun den kender.
function _bilPeg() {
  if (S.tab === "chat" && S.chatVen) return { ven: S.chatVen };
  if (S.tab === "rumsnak" && S.snakRum) return { rum: S.snakRum };
  return null;
}
function _bilEmneNu() {
  if (S.tab === "chat" && S.chatVen) return "snak|" + S.chatVen;
  if (S.tab === "rumsnak" && S.snakRum) return "rum|" + S.snakRum;
  return "";
}
function _samtaleGenhent(emneType) {
  const t = emneType || (S.tab === "chat" ? "snak" : S.tab === "rumsnak" ? "rum" : "");
  if (t === "snak" && A.chatHent) A.chatHent();
  else if (t === "rum" && A.snakHent) A.snakHent();
}

// ⭐⭐ v4.40.0 · BILLEDET PAA SKAERMEN. Det ligger over alt andet, fordi
// det er dét, man kom for — og fordi der ikke skal kunne trykkes paa noget
// bagved, mens det staar aabent.
//
// ⚠️ Der er INGEN gem-knap og ingen deling. Ikke fordi det ville vaere
// svaert, men fordi loeftet er, at billedet forsvinder. En gem-knap ville
// goere loeftet usandt paa den ene skaerm, hvor det betyder mest.
function _bilVis(EN) {
  if (!S.bilVisUrl) return "";
  // ⚠️ FANGET AF PRØVEN: uden et id ramte prøven appens LOGO (en data:-PNG)
  // i stedet for billedet. En prøve, der maaler det forkerte element, staar
  // groen uden daekning — derfor har baade rammen og billedet et navn.
  return '<div id="bil-vis" style="position:fixed;inset:0;z-index:60;background:rgba(4,8,14,.96);' +
    'display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px">' +
    '<img id="bil-vis-billede" src="' + esc(S.bilVisUrl) + '" alt="" style="max-width:100%;max-height:76vh;' +
    'border-radius:14px;border:1px solid var(--kant);object-fit:contain">' +
    '<p class="lille" style="margin:10px 6px 0;text-align:center;max-width:420px;line-height:1.5">' + (EN

function devKalender(){

      return (e.team === "oskar" || e.team === "alle") && new Date(e.dato + "T23:59:59") > nu;
