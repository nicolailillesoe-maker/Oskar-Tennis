<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>StreakTennis</title>
<style>
  :root{--guld:#F0CF61;--is:#9FD8E8;--kridt:#EDF2FA;--grus:#2E56D6;--daempet:#8B99B5;--dyb:#070D19;--kant:#22304d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--dyb);color:var(--kridt);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px 18px;text-align:center}
  .m{max-width:340px}
  .flam{font-size:64px;line-height:1;margin-bottom:8px}
  h1{font-size:24px;font-weight:900;letter-spacing:4px;color:var(--guld);margin:0}
  .u{font-size:12px;letter-spacing:3px;color:var(--is);margin:2px 0 20px}
  p{font-size:14px;line-height:1.55;color:var(--kridt);margin:0 0 18px}
  .lille{font-size:12px;color:var(--daempet);line-height:1.5}
  a.knap{display:block;background:var(--grus);color:#fff;text-decoration:none;
         border-radius:14px;padding:16px 18px;font-size:16px;font-weight:800;
         min-height:54px;line-height:22px}
</style>
</head>
<body>
<div class="m">
  <div class="flam">🔥</div>
  <h1>STREAK</h1>
  <div class="u">TENNIS</div>
  <p>Klub-udgaven er lagt sammen med StreakTennis.<br>Det er én app nu — og den kan mere.</p>
  <a class="knap" href="../StreakTennis/">Åbn StreakTennis →</a>
  <p class="lille" style="margin-top:16px">
    Klubkoden virker præcis som før. Du taster den under Indstillinger,
    og klubbens navn står i toppen som altid.
  </p>
</div>
<script>
// ⭐⭐ DØREN UD AF KLUB-LINJEN · 28/8-2026
//
// Nicolai 28/8: «jeg tænker vi går efter at bruge StreakTennis og
// pensionerer klub. Således har vi 1 platform.»
//
// ⭐ MÅLINGEN, DER GJORDE BESLUTNINGEN NEM (28/8):
//   · klub/index.html:  86 handlinger   ·  StreakTennis: 183
//   · KUN to handlinger fandtes i klub og ikke i StreakTennis:
//     `laengde` og `trykToggle` — og de blev FJERNET MED VILJE i
//     v4.38.0. `trainer-platform.html` har aldrig læst feltet.
//   · klub/index.html havde INTET manifest og intet
//     apple-mobile-web-app-capable. Den kunne derfor ALDRIG lægges på
//     en hjemmeskærm som rigtig app — og dermed aldrig få web-push
//     eller en badge på ikonet. Klub-linjen var strukturelt ude af
//     stand til at levere det, produktet skal kunne den 8/9.
//
// Denne side vedligeholdes aldrig. Den peger.
//
// ⚠️ OG DEN RYDDER OP EFTER SIG.
// En service worker overlever, at siden bag den forsvinder. Uden det
// her ville enhver telefon, der har åbnet /klub/, blive ved med at få
// den gamle app serveret fra cachen — lydløst, uden fejl.
(function () {
  var VIDERE = "../StreakTennis/";
  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) {
          // ⚠️ KUN klubbens egen. StreakTennis' arbejder (scope
          // /StreakTennis/) er appens offline-kopi og skal blive.
          var s = String(r.scope || "");
          if (s.indexOf("/klub/") >= 0) { try { r.unregister(); } catch (e) {} }
        });
      }).catch(function () {});
    }
  } catch (e) {}

  // ⚠️⚠️ DER SLETTES PR. ADRESSE, IKKE PR. CACHE — og det er en måling,
  // ikke en smagssag: alle tre apps på domænet bruger den SAMME cache
  // ("sai-v3" står ordret i alle tre sw.js), og Cache Storage er pr.
  // ORIGIN. Et caches.delete("sai-v3") her ville rive StreakTennis'
  // offline-kopi ned sammen med klubbens.
  try {
    if (window.caches && caches.keys) {
      caches.keys().then(function (navne) {
        navne.forEach(function (n) {
          caches.open(n).then(function (c) {
            c.keys().then(function (noegler) {
              noegler.forEach(function (k) {
                try {
                  if (new URL(k.url).pathname.indexOf("/klub/") === 0) c.delete(k);
                } catch (e) {}
              });
            }).catch(function () {});
          }).catch(function () {});
        });
      }).catch(function () {});
    }
  } catch (e) {}

  // ⭐ KNAPPEN ER DEN RIGTIGE VEJ — men står man her med en gammel app
  // på skærmen, skal man ikke selv gætte. Efter to sekunder går vi selv.
  // `replace`, så tilbage-knappen ikke sender folk retur til en død side.
  setTimeout(function () {
    try { location.replace(VIDERE); } catch (e) { location.href = VIDERE; }
  }, 2000);
})();
</script>
</body>
</html>
