# StreakTennis · iOS-skallen bygges og sendes til TestFlight fra en Mac i skyen.
# Kører KUN, når man trykker «Run workflow» under Actions (aldrig af sig selv ved upload).
#
# v4.7 (16/9 kl. 11.00) — byggenummeret tastes ikke længere i hånden: står feltet tomt, bruges kørslens løbenummer (github.run_number),
#   som altid stiger. Apple afviser en upload med et tal, der ikke er større end sidste gang — det er en menneskelig fejl, der ventede på at ske.
# v4.6 (16/9 kl. 07.40) — v4.4's adresse-rettelse ER RULLET TILBAGE i capacitor.config.json: Capacitors doks siger, at iosScheme IKKE må
#   være https (WKWebView ejer skemaet), og at hostname SKAL blive localhost, ellers mister appen «secure context» — og dermed WebCrypto,
#   som postkassen og boksens nøgle bygger på. Appen hedder capacitor://localhost, og DEN adresse skal stå i motorernes TILLADTE_ORIGINS.
# v4.5 (16/9 kl. 07.30) — byg 2: «Missing Compliance» igen. Vores fejl: v4.4's PlistBuddy-linje brugte stien fra roden EFTER et `cd ios/App`,
#   så nøglen blev aldrig skrevet — og trinnet var grønt (princip 75). Rettet sti + vagt, der måler kryptering-svaret OG byggenummeret i plisten.
# v4.4 (16/9 kl. 01.10) — byg 1 på telefonen: «Kunne ikke logge ind». MÅLT gennem pg_net: motorens dørvagt (TILLADTE_ORIGINS) svarer
#   tennis.sportsainalytics.com til en afsender, der hedder https://localhost — iPhonen kasserer svaret. Rettet i SKALLEN, ikke i
#   motoren: capacitor.config.json giver appen jeres eget domæne som adresse (server.hostname). Desuden: MinimumOSVersion 15.0
#   (Apple ITMS-90068, krav fra foråret 2027) og ITSAppUsesNonExemptEncryption=false i plisten.
# v4.3 (16/9 kl. 00.30) — byg #6 på macos-26: WWDR G3 findes allerede i nøgleringen («already exists») — tolereres nu VED NAVN, alt andet er stadig rødt.
# v4.2 (16/9 kl. 00.20) — byg #5: HELE kæden holdt (arkiv · profil · eksport · login hos Apple · upload startet). Apple afviste
#   kun SDK'en: «built with iOS 17.5 SDK — must be iOS 26 SDK». Runner macos-14 → macos-26 (Xcode 26; GA siden feb. 2026).
# v4.1 (16/9 kl. 00.15) — byg #4: eksporten ville sætte profilen på Capacitor.framework, fordi PRODUCT_BUNDLE_IDENTIFIER stod som
#   GLOBAL tilsidesættelse på arkivet og ramte alle targets. Væk — cap add ios sætter appens id selv; en vagt måler det nu.
# v4 (15/9-2026 kl. 23.55) — byg #3: ARCHIVE SUCCEEDED, men eksporten med «automatic» ville lave et SKY-forvaltet certifikat
#   («Cloud signing permission error» — kræver Admin-nøgle) og lavede derfor aldrig profilen. Nu MANUEL signering ved eksport:
#   App Store-profilen laves én gang i portalen og ligger som hemmelighed. API-nøglen (App Manager) bruges kun til uploaden.
# v3 (15/9-2026 kl. 23.30; v3.1 kl. 23.35: WWDR G3-mellemledet hentes ind i nøgleringen) — to fund fra byg #2:
#   · «Success» på 57 s med ** ARCHIVE FAILED ** i loggen: et rør (| tail) åd xcodebuilds fejlkode (princip 75). Nu bash med pipefail.
#   · «Your team has no devices from which to generate a provisioning profile»: arkivet bad om en UDVIKLINGSprofil, og den
#     kræver en registreret iPhone. Nu signeres arkivet ad hoc (som Apples eget Xcode Cloud gør), og først EKSPORTEN signerer
#     til App Store — med ét distributionscertifikat, lavet én gang og gemt som hemmelighed. Lader man xcodebuild lave
#     certifikatet selv, laver den et nyt pr. kørsel, og Apple siger stop efter få (developer.apple.com/forums/thread/695759).
#
# Kræver syv hemmeligheder i repoet (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID          · App Store Connect API-nøglens Key ID
#   ASC_ISSUER_ID       · Issuer ID (står øverst på API-siden)
#   ASC_KEY_P8_BASE64   · .p8-filens indhold, base64-kodet
#   APPLE_TEAM_ID       · Team ID (App ID Prefix / Membership details)
#   DIST_P12_BASE64     · Apple Distribution-certifikatet med privat nøgle (.p12/.pfx), base64-kodet — se LÆSMIG trin 2b
#   DIST_P12_PASSWORD   · kodeordet, .p12'en blev pakket med
#   DIST_PROFILE_BASE64 · App Store-profilen «StreakTennis App Store» (.mobileprovision), base64-kodet — se LÆSMIG trin 2c
name: ios-testflight
on:
  workflow_dispatch:
    inputs:
      byg_nr:
        description: "Byggenummer — lad feltet stå TOMT, så bruges kørslens eget løbenummer (stiger altid)"
        required: false
        default: ""
jobs:
  byg:
    runs-on: macos-26   # v4.2: Apple kræver iOS 26 SDK (Xcode 26) — macos-14 har 15.4 (byg #5: «SDK version issue»)
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # = bash -eo pipefail hos GitHub — et rør må ikke skjule en fejl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Xcode-version (maskinens standard — vi vælger ikke selv)
        run: xcodebuild -version
      - name: Capacitor · skallen
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
      - name: Byggenummer + version fra appen
        env:
          BYG_IND: ${{ github.event.inputs.byg_nr }}
          BYG_LOEB: ${{ github.run_number }}
        run: |
          # ⭐ v4.7 (16/9) · Nicolai: byggenummeret skal ikke tastes i hånden. Apple afviser en upload, hvis tallet
          #   ikke er STØRRE end sidste gang — og en tastefejl koster ti minutter og et gæt. Kørslens eget løbenummer
          #   stiger altid af sig selv. Feltet kan stadig udfyldes, hvis et bestemt tal ønskes.
          BYG="${BYG_IND:-$BYG_LOEB}"
          echo "BYG=$BYG" >> $GITHUB_ENV
          V=$(grep -o 'const VERSION = "v[0-9.]*' StreakTennis/index.html | grep -o '[0-9][0-9.]*')
          echo "App-version: $V · byg $BYG"
          cd ios/App && /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" App/Info.plist \
            && /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BYG" App/Info.plist
          # v4.5 · eksport-compliance svares i plisten (kun styresystemets kryptering: HTTPS + WebCrypto) — så spørger TestFlight ikke igen.
          # ⚠️ v4.4 skrev stien fra RODEN efter et `cd ios/App` — PlistBuddy lavede intet og gav grønt (princip 75). Vagten nedenfor MÅLER nu.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" App/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" App/Info.plist
          KRYPT=$(/usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" App/Info.plist)
          BYGNR=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" App/Info.plist)
          echo "Plisten: version $(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" App/Info.plist) · byg $BYGNR · kryptering-undtaget $KRYPT"
          test "$KRYPT" = "false" || { echo "⛔ ITSAppUsesNonExemptEncryption står ikke i plisten"; exit 1; }
          test "$BYGNR" = "$BYG" || { echo "⛔ byggenummeret i plisten er $BYGNR"; exit 1; }
      - name: API-nøglen lægges, hvor xcodebuild leder
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          test -s ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Distributionscertifikatet ind i en midlertidig nøglering
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/byg.keychain-db"; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          # Apples mellemled (WWDR G3) — .p12'en fra Windows bærer kun selve certifikatet, kæden skal kunne bygges her
          curl -sSfL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          if ! security import "$RUNNER_TEMP/wwdr.cer" -t cert -k "$KC" 2>&1 | tee "$RUNNER_TEMP/wwdr.txt"; then
            grep -q "already exists" "$RUNNER_TEMP/wwdr.txt" && echo "WWDR G3 ligger der allerede (macOS 26) — fint" || { echo "⛔ WWDR G3 kunne ikke importeres"; exit 1; }
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychain -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "Identiteter i nøgleringen:"; security find-identity -v -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" || { echo "⛔ intet Apple Distribution-certifikat i .p12'en"; exit 1; }
      - name: App Store-profilen lægges, hvor Xcode leder
        env:
          DIST_PROFILE_BASE64: ${{ secrets.DIST_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$DIST_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profil.mobileprovision"
          test -s "$RUNNER_TEMP/profil.mobileprovision" || { echo "⛔ DIST_PROFILE_BASE64 er tom"; exit 1; }
          UUID=$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" | plutil -extract UUID raw -)
          NAVN=$(security cms -D -i "$RUNNER_TEMP/profil.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/profil.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "Profil: «$NAVN» ($UUID)"
          test "$NAVN" = "StreakTennis App Store" || { echo "⛔ profilen hedder «$NAVN» — eksport-indstillingerne venter «StreakTennis App Store»"; exit 1; }
      - name: Team-id ind i eksport-indstillingerne
        run: /usr/libexec/PlistBuddy -c "Add :teamID string ${{ secrets.APPLE_TEAM_ID }}" ios-byg/ExportOptions.plist
      - name: Arkiv (ad hoc-signeret — ingen profil, ingen enhed; som Xcode Cloud)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/App.xcarchive archive \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} IPHONEOS_DEPLOYMENT_TARGET=15.0 | tail -60
          test -d build/App.xcarchive
          # v4.1 · vagt: appens bundle-id kommer fra capacitor.config.json (cap add ios) — ikke fra en global tilsidesættelse,
          # der også ramte Capacitor.framework/Cordova.framework og fik eksporten til at kræve profilen på dem (byg #4)
          ID=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleIdentifier" build/App.xcarchive/Info.plist)
          echo "Arkivets app: $ID"
          test "$ID" = "com.sportsainalytics.streaktennis" || { echo "⛔ arkivets bundle-id er «$ID»"; exit 1; }
      - name: Send til App Store Connect (manuel signering med profilen; API-nøglen bruges kun til uploaden)
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ios-byg/ExportOptions.plist -exportPath build/ud \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} | tail -60
      - name: Ryd nøgleringen (altid — også når det gik galt)
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/byg.keychain-db" || true
