function trendRaekke(EN, label, vals, enhed, stigerGodt) {

function pulsKort(k, EN) {
  if (!k.point || k.point.length < 8) return "";
  var n = k.point.length, kum = [], lab = [], sgr = [], prevG = 0, prevH = 0, sum = 0;
  for (var i = 0; i < n; i++) {
    sum += k.point[i].r === "V" ? 1 : -1; kum.push(sum);
    var sti = beregnStilling(k.point.slice(0, i + 1), k.oskarFirst, k.mtb, k.justeringer, k.saetTil, k.noAd);
    var g = sti.gO + sti.gM, hh = sti.hist.length;
    if (hh > prevH) { var hs = sti.hist[hh - 1]; lab.push([i, (EN ? "SET " : "SÆT ") + hs[0] + "-" + hs[1], 1]); sgr.push(i); prevH = hh; prevG = 0; }
    else if (g > prevG) { lab.push([i, sti.gO + "-" + sti.gM, 0]); prevG = g; }
  }
  var W = 320, H = 108, padX = 8, padY = 12, maxAbs = 1;
  for (var m = 0; m < n; m++) if (Math.abs(kum[m]) > maxAbs) maxAbs = Math.abs(kum[m]);
  var px = function(i){ return padX + i * (W - 2 * padX) / Math.max(1, n - 1); };
  var py = function(v){ return H / 2 - v * (H / 2 - padY) / maxAbs; };
  var pts = kum.map(function(v, i){ return px(i).toFixed(1) + "," + py(v).toFixed(1); }).join(" ");
  var nkey = (k.dato || "") + "|" + (k.modstander || "");
  var svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 16) + '" style="width:100%;display:block" xmlns="http://www.w3.org/2000/svg">';
  svg += '<line x1="' + padX + '" y1="' + (H / 2) + '" x2="' + (W - padX) + '" y2="' + (H / 2) + '" stroke="var(--guld)" stroke-width="1" opacity=".8"/>';
  sgr.forEach(function(i){ svg += '<line x1="' + px(i).toFixed(1) + '" y1="' + padY + '" x2="' + px(i).toFixed(1) + '" y2="' + (H - 4) + '" stroke="var(--kant)" stroke-width="1" stroke-dasharray="3,3"/>'; });
  svg += '<polyline points="' + pts + '" fill="none" stroke="var(--is)" stroke-width="2" stroke-linejoin="round"/>';
  var hop = lab.length > 15 ? 2 : 1, lnr = 0;
  lab.forEach(function(L){ if (!L[2]) { lnr++; if (hop > 1 && lnr % hop !== 0) return; } svg += '<text x="' + px(L[0]).toFixed(1) + '" y="' + (H + 12) + '" text-anchor="middle" font-size="' + (L[2] ? 7.5 : 7) + '" font-weight="' + (L[2] ? 800 : 600) + '" fill="' + (L[2] ? "var(--guld)" : "var(--daempet)") + '">' + L[1] + '</text>'; });
  for (var t = 0; t < n; t++) svg += '<rect data-a="puls" data-v="' + esc(nkey) + '|' + t + '" x="' + (px(t) - (W - 2 * padX) / (2 * n)).toFixed(1) + '" y="0" width="' + ((W - 2 * padX) / n).toFixed(2) + '" height="' + H + '" fill="transparent" style="cursor:pointer"/>';
  svg += '</svg>';
  var cap = "";
  if (S.puls && S.puls.indexOf(nkey + "|") === 0) {
    var bi = parseInt(S.puls.slice(nkey.length + 1), 10);
    if (bi >= 0 && bi < n) {
      var p = k.point[bi];
      var stc = beregnStilling(k.point.slice(0, bi + 1), k.oskarFirst, k.mtb, k.justeringer, k.saetTil, k.noAd);
      var AA = EN ? { vinder: "winner", es: "service ace", uf: "free error", tvunget: "forced error", dobbelt: "double fault", returfejl: "return error", mod_vinder: "opponent winner", mod_es: "opponent ace", mod_returfejl: "opponent return error", mod_uf: "opponent free error", mod_tvunget: "opponent pressed to error", mod_dobbelt: "opponent double fault" }
                  : { vinder: "vinderslag", es: "serve-es", uf: "gratis fejl", tvunget: "presset til fejl", dobbelt: "dobbeltfejl", returfejl: "returfejl", mod_vinder: "modstander-vinder", mod_es: "modstander-es", mod_returfejl: "modstanderens returfejl", mod_uf: "modstanderens gratis fejl", mod_tvunget: "modstander presset til fejl", mod_dobbelt: "modstander-dobbeltfejl" };
      var zt = (p.r === "T" && p.z ? (EN ? [", net", ", long", ", wide"] : [", i nettet", ", ud lang", ", ud bred"])[p.z - 1] || "" : "");

const UGEFOKUS = [];
function ugensFokus(EN) {
  const nu = new Date(); nu.setHours(0, 0, 0, 0);
  for (const [fra, til, da, en] of UGEFOKUS) {
    if (nu >= new Date(fra + "T00:00:00") && nu <= new Date(til + "T00:00:00")) return EN ? en : da;
  }
  return null;
}

function ugeNoegle(dISO) {
  const d = new Date(dISO + "T00:00:00");
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); // torsdags-tricket (ISO-uge)
  const aar = d.getFullYear();
  const start = new Date(aar, 0, 4);
  start.setDate(start.getDate() + 3 - ((start.getDay() + 6) % 7));
  return aar * 100 + Math.round((d - start) / 604800000) + 1;
}
function ugeMaal(fysLog) {
  const MAAL = 3;
  const taelling = {};
  fysLog.forEach((e) => { const n = ugeNoegle(e.d); taelling[n] = (taelling[n] || 0) + 1; });
  const nuISO = new Date().toISOString().slice(0, 10);
  const nu = ugeNoegle(nuISO);
  const denneUge = taelling[nu] || 0;
  // Streak: sammenhængende uger med målet nået — bagud fra sidste uge, + denne uge hvis nået
  let streak = denneUge >= MAAL ? 1 : 0;
  const d = new Date(nuISO + "T00:00:00");
  while (true) {
    d.setDate(d.getDate() - 7);
    if ((taelling[ugeNoegle(d.toISOString().slice(0, 10))] || 0) >= MAAL) streak += 1; else break;
    if (streak > 260) break;
  }
  return { denneUge, MAAL, streak };
}

// Træningsresumé til trænerlaget (19/8, Nicolais beslutning): OMFANGET pr. uge
// — antal tennis, antal fys, minutter — aldrig indholdet. Bygges af egen log,
// nyeste uge først, højst 8 uger. Noter og typer bliver på telefonen.
function traeningsResume() {
  const spande = {};
  const laeg = function(log, felt){ (log || []).forEach(function(e){
    if (!e || !e.d) return;
    const u = ugeNoegle(e.d);
    const s = (spande[u] = spande[u] || { u: u, t: 0, f: 0, m: 0 });
    s[felt] += 1; s.m += (typeof e.m === "number" && e.m > 0 ? Math.min(e.m, 600) : 0);
  }); };
  laeg(S.ttLog, "t"); laeg(S.fysLog, "f");
  return Object.keys(spande).map(function(k){ return spande[k]; })
    .sort(function(a, b){ return b.u - a.u; }).slice(0, 8);
}

                 "x-klub-noegle": S.klubKode, "x-spiller-noegle": S.spillerNoegle },
      body: JSON.stringify({ handling, ...krop }) });
    clearTimeout(ur);
    const d = await r.json().catch(function(){ return {}; });
    return r.ok ? d : { fejl: d.kode || "netvaerk", status: r.status, detaljer: d.detaljer };
  } catch (e) { clearTimeout(ur); return { fejl: "netvaerk" }; }
}

function kampResume() {
  return (S.gemte || []).slice(0, 200).map(function(k){
    const p = k.point || [];
    const c = function(r, a){ return p.filter(function(x){ return x.r === r && x["\u00e5"] === a; }).length; };
    const skabt = c("V","vinder") + c("V","es") + c("V","mod_tvunget");
    const foraeret = c("T","uf") + c("T","dobbelt") + c("T","returfejl");
    const V = p.filter(function(x){ return x.r === "V"; }).length;
    return { d: String(k.dato || "").slice(0,12), res: String(k.resultat || "").slice(0,24),
             turnering: String(k.turnering || "").slice(0,40),
             bolde: p.length, balance: skabt - foraeret,
             vundet: k.facitVandt !== undefined ? !!k.facitVandt : V > p.length - V };
  });
}

function rivalNoegle(navne, grupper) {

const KAMP_HVIDLISTE = ["dato","spiller","modstander","turnering","sted","resultat","oskarFirst","mtb","saetTil","noAd","facitVandt","afsluttet","justeringer","point"];
const POINT_HVIDLISTE = ["r","\u00e5","f","l","z","s"];

function byggAnalysePayload(k) {
  const ud = {};
  KAMP_HVIDLISTE.forEach(function(f) {
    if (f === "point") return;
    var v = k[f];
    if (v === undefined || v === null || v === "") return;
    if (typeof v === "string") v = v.slice(0, 60);
    ud[f] = v;
  });
  if (!ud.spiller) ud.spiller = (SPILLER);
  ud.point = (k.point || []).map(function(p) {
    var r = {};
    POINT_HVIDLISTE.forEach(function(f) { if (p[f] !== undefined) r[f] = p[f]; });
    return r;
  });
  return ud;
}

function analyseFejltekst(kode, status, EN) {

  if (kode === "validering" || status === 422) return EN ? "The match data was rejected by the safety check." : "Kampdata blev afvist af sikkerhedsvagten.";

  if (status === 0) return EN ? "No connection. Check the network and try again." : "Ingen forbindelse. Tjek netv\u00e6rket og pr\u00f8v igen.";

// ---------- Statistik ----------
function statistik(k) {
  const st = beregnStilling(k.point, k.oskarFirst, k.mtb, k.justeringer, k.saetTil, k.noAd);
  const F = st.flags;
  const v = k.point.filter(p => p.r === "V").length;
  const t = k.point.length - v;
  const uf = k.point.filter(p => p.r === "T" && (p.å === "uf" || p.å === "dobbelt" || p.å === "returfejl")).length;
  const vindere = k.point.filter(p => p.r === "V" && (p.å === "vinder" || p.å === "es")).length;
  const modTv = k.point.filter(p => p.å === "mod_tvunget").length;
  const modEs = k.point.filter(p => p.å === "mod_es").length;
  const idxServe = k.point.map((p,i)=>i).filter(i => F[i] && F[i].server === true);
  const oServe = idxServe.map(i => k.point[i]);
  const retur = k.point.filter((p,i) => F[i] && F[i].server === false);
  const oServe1 = oServe.filter(p => p.f === 1);
  const oServe2 = oServe.filter(p => p.f === 2);
  const bpFor = k.point.filter((p,i) => F[i] && F[i].stor && F[i].stor.indexOf(("BREAKBOLD "+SPILLER)) === 0);
  const bpMod = k.point.filter((p,i) => F[i] && F[i].stor && F[i].stor.indexOf("BREAKBOLD mod") === 0);
  const perSaet = [];
  k.point.forEach((p, i) => {
    const sn = (F[i] && F[i].saet) || 1;
    while (perSaet.length < sn) perSaet.push({ v: 0, t: 0, uf: 0, vin: 0, s1: 0, sp: 0, s1v: 0, s2: 0, s2v: 0, df: 0 });
    const ps = perSaet[sn - 1];
    if (p.r === "V") ps.v += 1; else ps.t += 1;
    if (p.r === "T" && (p.å === "uf" || p.å === "dobbelt" || p.å === "returfejl")) ps.uf += 1;
    if (p.r === "V" && (p.å === "vinder" || p.å === "es")) ps.vin += 1;
    if (p.å === "dobbelt") ps.df += 1;
    if (p.å === "mod_tvunget") ps.mtv = (ps.mtv || 0) + 1;
    if (F[i] && F[i].server === true) {
      ps.sp += 1;
      if (p.f === 1) { ps.s1 += 1; if (p.r === "V") ps.s1v += 1; }
      else { ps.s2 += 1; if (p.r === "V") ps.s2v += 1; }
    }
  });
  const dl = (n) => { const q = k.point.filter(p => p.l === n); return [q.filter(p => p.r === "V").length, q.length]; };
  const budIVbrud = k.point.filter(p => p.l === 1 && p.r === "T" && (p.å === "uf" || p.å === "dobbelt" || p.å === "returfejl")).length;
  const oFejl = k.point.filter(p => p.r === "T" && (p.å === "uf" || p.å === "tvunget" || p.å === "returfejl"));
  const zN = oFejl.filter(p => p.z === 1).length, zL = oFejl.filter(p => p.z === 2).length, zB = oFejl.filter(p => p.z === 3).length;
  return { st, v, t, uf, vindere, perSaet, skabt: vindere + modTv, balance: vindere + modTv - uf, modEs, zN, zL, zB, dK: dl(1), dM: dl(2), dL: dl(3), budIVbrud,
    serve: [oServe.filter(p=>p.r==="V").length, oServe.length],
    retur: [retur.filter(p=>p.r==="V").length, retur.length],
    s1pct: oServe.length ? Math.round(oServe1.length / oServe.length * 100) : 0,
    s1: [oServe1.filter(p=>p.r==="V").length, oServe1.length],
    s2: [oServe2.filter(p=>p.r==="V").length, oServe2.length],
    df: k.point.filter(p => p.r === "T" && p.å === "dobbelt").length,
    bpFor: [bpFor.filter(p=>p.r==="V").length, bpFor.length],
    bpMod: [bpMod.filter(p=>p.r==="V").length, bpMod.length] };
}

function lavEksport(k) {
  const s = statistik(k);
  return [
    ("KAMP: "+SPILLER+" vs ") + k.modstander + " · " + k.turnering + " · " + k.dato + " · resultat: " + (k.resultat || "?"),
    "Point: " + s.v + "-" + s.t + " (" + k.point.length + " bolde) · Sæt: " + s.st.hist.map(h => h[2] ? h[0]+"-"+h[1]+" ("+h[2]+")" : h[0]+"-"+h[1]).join(", "),
    (SPILLER+"s"+" serv: ") + s.serve[0] + "/" + s.serve[1] + " · 1. serv i spil: " + s.s1pct + " % · vundet på 1. serv: " + s.s1[0] + "/" + s.s1[1] + " · på 2. serv: " + s.s2[0] + "/" + s.s2[1] + " · dobbeltfejl: " + s.df,
    "Retur: " + s.retur[0] + "/" + s.retur[1] + " · Breakbolde udnyttet: " + s.bpFor[0] + "/" + s.bpFor[1] + " · afværget: " + s.bpMod[0] + "/" + s.bpMod[1],

    "Pr. sæt: " + s.perSaet.map((ps, si) => "S" + (si + 1) + " " + ps.v + "-" + ps.t + " (UE " + ps.uf + ", vindere " + ps.vin + (ps.sp ? ", 1.serv " + Math.round(ps.s1 / ps.sp * 100) + " %" : "") + ")").join(" · "),
    ((s.zN || 0) + (s.zL || 0) + (s.zB || 0) > 0 ? ("Fejl-zoner ("+SPILLER+"s"+" fejl): net ") + s.zN + " · ud lang " + s.zL + " · ud bred " + s.zB : null),
    "Dueller (vundet/spillet): korte(1-4) " + s.dK[0] + "/" + s.dK[1] + " · mellem(5-8) " + s.dM[0] + "/" + s.dM[1] + " · lange(9+) " + s.dL[0] + "/" + s.dL[1] + (" · "+SPILLER+"s"+" gratis fejl i KORTE dueller (bud IV-brud): ") + s.budIVbrud,
    "Rå sekvens (V/T:årsag:serv:duel K/M/L): " + k.point.map(p => p.r + ":" + p.å + ":" + p.f + ":" + (p.l === 1 ? "K" : p.l === 2 ? "M" : p.l === 3 ? "L" : "?")).join(" "),
    ("("+SPILLER+" servede først: ") + (k.oskarFirst ? "ja" : "nej") + " · 3. sæt = MTB: " + (k.mtb ? "ja" : "nej") + ")",
  ].join("\n");
}

    if (!S.klubKode) { S.kodeAaben = true; S.kodeUdkast = ""; S.hentBesked = { i: n, fejl: true, t: EN ? "Enter the club code first \u2014 you only do this once on this device." : "Indtast klubkoden f\u00f8rst \u2014 det g\u00f8res kun \u00e9n gang p\u00e5 denne enhed." }; render(); return; }
    if (S.henter !== null) return;
    S.henter = n; S.hentBesked = null; render();
    const styring = new AbortController();
    const ur = setTimeout(function(){ styring.abort(); }, 120000);
    fetch(ANALYSE_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "x-klub-noegle": S.klubKode },
      body: JSON.stringify({ sprog: EN ? "en" : "da", kamp: byggAnalysePayload(k) }),
      signal: styring.signal
    }).then(function(r) {
      return r.json().catch(function(){ return {}; }).then(function(d) { return { s: r.status, ok: r.ok, d: d }; });
    }).then(function(sv) {
      clearTimeout(ur);
      if (sv.ok && sv.d && sv.d.analyse) {
        if (S.gemte[n]) { S.gemte[n].analyse = sv.d.analyse; gemAlle(); }
        S.henter = null; S._sf = S._sf || {}; S._sf["1"] = true;
        S.hentBesked = { i: n, fejl: false, t: EN ? "Analysis fetched and saved to the match." : "Analysen er hentet og gemt p\u00e5 kampen." };
      } else {
        S.henter = null; S._sf = S._sf || {}; S._sf["1"] = true;
        S.hentBesked = { i: n, fejl: true, t: analyseFejltekst(sv.d && sv.d.kode, sv.s, EN) };
      }
      render();
    }).catch(function() {
      clearTimeout(ur);
      S.henter = null; S._sf = S._sf || {}; S._sf["1"] = true;
      S.hentBesked = { i: n, fejl: true, t: analyseFejltekst(null, 0, EN) };
      render();
    });
  },
  klubKodeAabn: () => { S.kodeAaben = !S.kodeAaben; S.kodeUdkast = ""; S.hentBesked = null; render(); },
  klubKodeGem: () => { const v = (S.kodeUdkast || "").trim(); if (!v) return; S.klubKode = v; lager.gem("sai-klubkode", v); S.kodeAaben = false; S.kodeUdkast = ""; S.hentBesked = { i: -1, fejl: false, t: S.sprog === "en" ? "Club code saved on this device." : "Klubkoden er gemt p\u00e5 denne enhed." }; render(); },
  klubKodeRyd: () => { S.klubKode = ""; lager.gem("sai-klubkode", ""); S.kodeAaben = false; S.kodeUdkast = ""; render(); },
  eksport: (i) => { S.eksport = lavEksport(S.gemte[+i]); S._sf = S._sf || {}; S._sf["1"] = true; render();
    setTimeout(function(){ var b = document.getElementById("eksport-boks"); if (b) b.scrollIntoView({behavior:"smooth", block:"center"}); }, 60); },
  analyseAabn: (i) => { S.redigerA = S.redigerA === +i ? null : +i; S.aTekst = (S.gemte[+i] && S.gemte[+i].analyse) || ""; S._sf = S._sf || {}; S._sf["1"] = true; render(); },
  analyseGem: (i) => { if (S.gemte[+i]) { S.gemte[+i].analyse = S.aTekst; gemAlle(); } S.redigerA = null; S.aTekst = ""; S._sf = S._sf || {}; S._sf["1"] = true; render(); },
  analyseAnnuller: () => { S.redigerA = null; S.aTekst = ""; render(); },
  sletSpoerg: (i) => { S.sletBekraeft = +i; render(); },
  sletFortryd: () => { S.sletBekraeft = null; render(); },
  slet: (i) => { S.gemte.splice(+i, 1); S.sletBekraeft = null; S.eksport = null; gemAlle(); render(); },
};

const esc = (t) => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


function avat(navn, px){
  var farver = ["#E3B341","#9FD8E8","#C97B54","#4CAF78"];
  var h = 0; for (var i = 0; i < navn.length; i++) h = (h * 31 + navn.charCodeAt(i)) >>> 0;
  var dele = navn.trim().split(/\s+/);
  var ini = (dele[0][0] + (dele.length > 1 ? dele[dele.length-1][0] : "")).toUpperCase();
  return '<span class="avat" style="width:' + px + 'px;height:' + px + 'px;font-size:' + Math.round(px*0.4) + 'px;background:' + farver[h % 4] + '">' + ini + '</span>';
}



function turneringsKontekst(EN){
  if (!S._kal || !S._kal.length) return "";
  var nu = new Date(); var p2 = function(n){ return (n<10?"0":"")+n; };
  var idag = nu.getFullYear()+"-"+p2(nu.getMonth()+1)+"-"+p2(nu.getDate());
  var im = new Date(nu.getTime()+86400000);
  var imorgen = im.getFullYear()+"-"+p2(im.getMonth()+1)+"-"+p2(im.getDate());
  var e = null, hvornaar = "";
  for (var i=0;i<S._kal.length;i++){
    var k = S._kal[i];
    if (k.dato === idag && k.tid && (k.tid > p2(nu.getHours())+":"+p2(nu.getMinutes()))) { e=k; hvornaar = EN?"TODAY":"I DAG"; break; }
    if (k.dato === imorgen) { e=k; hvornaar = EN?"tomorrow":"i morgen"; break; }
  }
  if (!e) return "";
  var raad = hvornaar.indexOf("DAG")>=0 || hvornaar==="TODAY"
    ? (EN?" — close out efficiently and recover: two matches in one day.":" — luk kampen effektivt og restituér: to kampe på én dag.")
    : (EN?" — manage the legs; the ladder continues.":" — forvalt kræfterne; stigen fortsætter.");
  return '<p class="lille" style="margin:8px 0 0;border-top:1px dashed var(--kant);padding-top:8px">🗓 <b style="color:var(--guld)">' + (EN?"NEXT":"NÆSTE") + ' (' + hvornaar + ' ' + (EN?"at":"kl.") + ' ' + e.tid + '):</b> ' + e.titel + ' ' + e.detalje + raad + '</p>';
}

function devKalender(){
  var plan = (S.verden !== "udv" && S.tab === "plan");
  if (!plan && (S.tab !== "hjem" || S.verden !== "udv")) return;
  var m = document.getElementById(plan ? "dev-kal-plan" : "dev-kal");
  if (!m) return;
  fetch("kalender.json",{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    var nu = new Date();
    var kommende = (d.events||[]).filter(function(e){
      return (e.team === "oskar" || e.team === "alle") && new Date(e.dato + "T23:59:59") > nu;
    }).sort(function(a,b){ return (a.dato+a.tid).localeCompare(b.dato+b.tid); });
    S._kal = kommende;
    if (!kommende.length) return;
    if (plan) {
      m.innerHTML = '<div class="kort" style="border-left:3px solid var(--guld)"><h3>📅 Kampe & tider</h3>' +
        kommende.map(function(e){
          var dd = e.dato.split("-");
          return '<div style="display:flex;gap:8px;font-size:12.5px;margin-bottom:6px"><b style="color:var(--guld);flex:none">' + (+dd[2]) + "/" + (+dd[1]) + (e.tid ? " " + e.tid : "") + '</b><span>' + e.titel + " " + e.detalje + (e.sted ? ' · <span style="color:var(--daempet)">' + e.sted + '</span>' : '') + '</span></div>';
        }).join("") +
        '<p class="lille" style="margin:4px 0 0;opacity:.7">Opdateres automatisk fra kampkalenderen</p></div>';
      return;
    }
    var e = kommende[0];
    var dd = e.dato.split("-");
    m.innerHTML = "📅 " + (+dd[2]) + "/" + (+dd[1]) + (e.tid ? " kl. " + e.tid : "") + (e.sted ? " · " + e.sted : "") + " · " + e.titel + " " + e.detalje;
    var hero = document.getElementById("hero-sub");
    if (hero) {
      var idag = new Date(); var p2 = function(n){ return (n<10?"0":"")+n; };
      var idagStr = idag.getFullYear() + "-" + p2(idag.getMonth()+1) + "-" + p2(idag.getDate());
      if (e.dato === idagStr) hero.innerHTML = "<b style=\"color:var(--guld)\">I DAG" + (e.tid ? " kl. " + e.tid : "") + ": " + e.titel + " " + e.detalje + "</b>";
    }
  }).catch(function(){});
}
