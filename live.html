<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1220">
<title>Live · StreakCoach</title>
<style>
/* live.html v1 · 9/11-2026 · KLUBBENS LIVE-SKÆRM — til TV'et i klubhuset og pc'en på kontoret.
   Nicolai 9/11: «scoreboardet findes jo allerede i klub-app'en. De skal have præcist det samme» · «jeg vil have et link til hver klubs
   live så de kan sætte det op i klubben… og følge med» · «På TV, på pc'en..»
   Ingen knapper — en skærm på væggen trykker ingen på. Henter hvert 30. sekund gennem `program-vis` (live), der kun kender tokenet.
   Det, der vises, er tennis: fornavn · turnering · stillingen. Modstanderen står som «Modstander» — aldrig et navn.
   Samme farver som StreakTennis og programsiden (tokens fra appens :root). Sproget: &l=en i linket, som programsiden. */
:root{--nat:#111C33;--dyb:#070D19;--kort:rgba(255,255,255,.05);--kant:rgba(255,255,255,.12);--flade:#1B2A44;--kridt:#EDF2FA;--daempet:#8B99B5;--is:#9FD8E8;--grus:#2E56D6;--guld:#F0CF61;--vundet:#22995A;--roed:#FF5A64;--tekst2:#B9C6D8;--fod:#4A5A78}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:radial-gradient(120% 55% at 50% -8%,#14264A 0%,#0B1220 55%) fixed #0B1220;color:var(--kridt);min-height:100vh;font-size:clamp(14px,1.05vw,22px)}
body.stille{cursor:none}
.side{max-width:2400px;margin:0 auto;padding:clamp(14px,1.6vw,36px) max(16px,env(safe-area-inset-right),2vw) clamp(18px,2vw,40px) max(16px,env(safe-area-inset-left),2vw);min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:clamp(10px,1vw,20px);border-bottom:1px solid var(--kant);margin-bottom:clamp(14px,1.4vw,30px);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:4px}
.wordmark{font-size:clamp(10px,.7vw,15px);letter-spacing:4px;font-weight:700;color:var(--guld);line-height:1}
.brandby{font-size:clamp(9px,.6vw,13px);letter-spacing:.6px;font-weight:600;color:var(--kridt);line-height:1}
.brandby b{color:var(--is)}
.klub{font-size:clamp(22px,2.4vw,52px);font-weight:900;letter-spacing:.5px;margin:0;line-height:1.05;overflow-wrap:anywhere}
.hoejre{display:flex;align-items:center;gap:clamp(10px,1.2vw,26px)}
.livemaerke{display:inline-flex;align-items:center;gap:.5em;font-weight:900;letter-spacing:2px;color:var(--roed);font-size:clamp(13px,1.1vw,24px)}
.prik{width:.75em;height:.75em;border-radius:50%;background:var(--roed);box-shadow:0 0 0 0 rgba(255,90,100,.7);animation:puls 2s infinite}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(255,90,100,.6)}70%{box-shadow:0 0 0 .6em rgba(255,90,100,0)}100%{box-shadow:0 0 0 0 rgba(255,90,100,0)}}
@media (prefers-reduced-motion:reduce){.prik{animation:none}}
.ur{font-size:clamp(20px,2vw,44px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--tekst2)}
main{flex:1}
.gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,clamp(320px,36vw,860px)),1fr));gap:clamp(12px,1.2vw,26px)}
.kamp{background:linear-gradient(160deg,#2A1020,#150B16);border:1px solid rgba(255,90,100,.45);border-radius:clamp(14px,1.1vw,24px);padding:clamp(12px,1.2vw,26px) clamp(14px,1.4vw,30px)}
.kamphoved{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--tekst2);font-size:clamp(12px,.95vw,20px);margin-bottom:clamp(8px,.8vw,16px)}
.kamphoved .turn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:700}
.kamphoved .tid{flex:none;color:var(--daempet)}
.tavle{display:grid;grid-template-columns:1fr auto;row-gap:clamp(4px,.5vw,10px);align-items:center}
.raekke{display:contents}
.navn{display:flex;align-items:center;gap:.5em;font-size:clamp(20px,2vw,46px);font-weight:900;min-width:0}
.navn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modst .navn{font-weight:700;color:var(--tekst2)}
.serv{width:.42em;height:.42em;border-radius:50%;background:var(--guld);flex:none}
.serv.ikke{background:transparent}
.tal{display:flex;justify-content:flex-end;gap:clamp(6px,.7vw,16px);font-variant-numeric:tabular-nums}
.c{min-width:1.6em;text-align:center;font-size:clamp(20px,2vw,46px);font-weight:700;color:var(--daempet)}
.c.parti{color:var(--kridt);font-weight:900}
.c.point{min-width:2.1em;border-radius:.3em;background:rgba(159,216,232,.14);color:var(--is);font-weight:900}
.modst .c.point{background:rgba(255,255,255,.06);color:var(--tekst2)}
.tb{display:inline-block;margin-top:clamp(6px,.6vw,12px);font-size:clamp(11px,.85vw,18px);font-weight:800;letter-spacing:1.5px;color:var(--guld)}
.tom{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:52vh;gap:clamp(10px,1vw,20px)}
.tom h2{font-size:clamp(24px,2.8vw,60px);margin:0;font-weight:900}
.tom p{margin:0;max-width:44em;color:var(--tekst2);font-size:clamp(14px,1.3vw,28px);line-height:1.45}
.fod{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:clamp(16px,1.6vw,34px);padding-top:clamp(10px,1vw,20px);border-top:1px solid var(--kant);color:var(--daempet);font-size:clamp(11px,.85vw,18px)}
.fod .linje{display:flex;flex-direction:column;gap:4px}
.fod .advar{color:var(--guld);font-weight:700}
.qr{display:flex;align-items:center;gap:clamp(8px,.8vw,16px);color:var(--kridt);font-weight:700}
.qr svg{width:clamp(64px,5.2vw,120px);height:auto;display:block;border-radius:6px}
.qr small{display:block;color:var(--daempet);font-weight:600;margin-top:2px}
.besked{display:flex;align-items:center;justify-content:center;text-align:center;min-height:52vh}
.besked p{font-size:clamp(18px,2vw,40px);font-weight:800;max-width:30em;margin:0;line-height:1.4}
</style>
</head>
<body>
<div class="side">
  <div class="top">
    <div style="display:flex;flex-direction:column;gap:clamp(6px,.6vw,12px);min-width:0">
      <div class="brand"><span class="wordmark">STREAKCOACH</span><span class="brandby">Sports<b>AI</b>nalytics</span></div>
      <h1 class="klub" id="klub"></h1>
    </div>
    <div class="hoejre"><span class="livemaerke"><span class="prik"></span><span id="livetekst">LIVE</span></span><span class="ur" id="ur"></span></div>
  </div>
  <main id="app"><div class="besked"><p id="henter">Henter live-kampene …</p></div></main>
  <div class="fod">
    <div class="linje"><span id="fodtekst"></span><span id="stempel"></span></div>
    <div class="qr"><svg role="img" aria-label="QR: sportsainalytics.com" viewBox="0 0 33 33" class="segno"><path fill="#fff" d="M0 0h33v33h-33z"/><path class="qrline" stroke="#0b1220" d="M2 2.5h7m1 0h2m5 0h2m1 0h3m1 0h7m-29 1h1m5 0h1m1 0h2m4 0h2m6 0h1m5 0h1m-29 1h1m1 0h3m1 0h1m3 0h1m2 0h3m2 0h2m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h3m5 0h2m1 0h1m2 0h1m1 0h3m1 0h1m-29 1h1m1 0h3m1 0h1m2 0h1m1 0h1m1 0h1m3 0h3m2 0h1m1 0h3m1 0h1m-29 1h1m5 0h1m3 0h1m1 0h1m1 0h1m2 0h1m1 0h1m2 0h1m5 0h1m-29 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-21 1h2m2 0h3m2 0h2m-19 1h1m1 0h2m1 0h3m2 0h1m2 0h2m1 0h2m1 0h2m1 0h1m2 0h1m1 0h2m-29 1h3m1 0h2m1 0h1m1 0h1m5 0h6m1 0h3m3 0h1m-26 1h1m2 0h1m1 0h1m1 0h1m3 0h2m2 0h1m2 0h1m1 0h2m1 0h2m-27 1h2m4 0h1m2 0h2m1 0h3m3 0h1m2 0h1m5 0h1m-28 1h1m1 0h4m2 0h1m1 0h1m4 0h2m1 0h2m2 0h1m1 0h2m-27 1h2m1 0h3m2 0h3m2 0h1m3 0h1m1 0h1m1 0h2m3 0h3m-29 1h2m2 0h1m1 0h1m1 0h2m2 0h1m1 0h1m2 0h1m1 0h1m2 0h3m1 0h3m-29 1h2m1 0h1m1 0h1m2 0h1m4 0h1m1 0h1m4 0h1m1 0h2m3 0h1m-28 1h8m2 0h1m7 0h4m1 0h3m1 0h1m-27 1h2m2 0h1m3 0h1m2 0h2m3 0h1m2 0h1m2 0h1m1 0h3m-28 1h1m1 0h1m1 0h1m1 0h2m1 0h3m5 0h1m2 0h2m2 0h1m1 0h1m-25 1h1m1 0h1m7 0h1m2 0h4m1 0h2m1 0h1m2 0h1m-26 1h2m3 0h3m1 0h2m1 0h1m1 0h1m1 0h10m-19 1h3m1 0h4m1 0h2m1 0h1m3 0h5m-29 1h7m1 0h6m2 0h5m1 0h1m1 0h2m1 0h1m-28 1h1m5 0h1m1 0h3m1 0h1m3 0h1m1 0h1m1 0h1m3 0h2m2 0h1m-29 1h1m1 0h3m1 0h1m2 0h2m3 0h2m2 0h1m1 0h5m1 0h1m1 0h1m-29 1h1m1 0h3m1 0h1m1 0h1m1 0h1m3 0h1m1 0h2m3 0h1m2 0h2m1 0h1m-28 1h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h3m3 0h1m2 0h1m2 0h1m1 0h1m-29 1h1m5 0h1m3 0h1m1 0h1m3 0h1m1 0h1m1 0h4m1 0h1m1 0h1m-28 1h7m1 0h2m3 0h3m1 0h1m1 0h3m1 0h1m1 0h1m1 0h1"/></svg><div><span id="qrtekst"></span><small>sportsainalytics.com</small></div></div>
  </div>
</div>
<script>
(function(){
  var URL_LIVE = "https://dihzphfsffritfszqkko.supabase.co/functions/v1/program-vis";
  var HVERT_MS = 30000;
  var ORD = {
    da: { henter: "Henter live-kampene …", tomH: "Ingen fra klubben spiller live lige nu",
          tomP: "Kampene står her, så snart en spiller sender sin kamp live fra StreakTennis.",
          modst: "Modstander", kamp: "Kamp", startet: "startet {t}", tb: "TIEBREAK", live: "LIVE",
          fod: "Klubbens live-kampe · opdateres hvert halve minut · det er gratis at se med", sidst: "sidst hentet {t}",
          qr: "Spil selv live med StreakTennis",
          link: "Der mangler et link-id. Klubben finder linket under 🔴 Live nu i StreakCoach.",
          ikke: "Skærmen er ikke tændt lige nu. Den viser kampene af sig selv, så snart klubben tænder den.",
          net: "Ingen forbindelse — prøver igen om lidt.", fejl: "Live-kampene kunne ikke hentes ({s}) — prøver igen om lidt.",
          gammel: "Listen er fra {t} — prøver igen om lidt." },
    en: { henter: "Fetching the live matches …", tomH: "Nobody from the club is playing live right now",
          tomP: "Matches appear here as soon as a player sends their match live from StreakTennis.",
          modst: "Opponent", kamp: "Match", startet: "started {t}", tb: "TIEBREAK", live: "LIVE",
          fod: "The club's live matches · updated every 30 seconds · watching is always free", sidst: "last fetched {t}",
          qr: "Play live yourself with StreakTennis",
          link: "The link id is missing. The club finds the link under 🔴 Live now in StreakCoach.",
          ikke: "The screen isn't switched on right now. It shows the matches by itself as soon as the club switches it on.",
          net: "No connection — trying again shortly.", fejl: "The live matches couldn't be fetched ({s}) — trying again shortly.",
          gammel: "The list is from {t} — trying again shortly." }
  };
  var app = document.getElementById("app");
  var sprog = "da", data = null, sidst = null, fejl = null, henter = false;
  function O(){ return ORD[sprog] || ORD.da; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function param(navn){ var m = new RegExp("[#?&]" + navn + "=([^&]*)").exec(location.hash) || new RegExp("[?&]" + navn + "=([^&]*)").exec(location.search); if (!m) return ""; try { return decodeURIComponent(m[1]); } catch (_e) { return m[1]; } }
  function token(){ var m = /^\s*([0-9a-fA-F]{24})/.exec(param("k")); return m ? m[1].toLowerCase() : ""; }
  function kl(iso){ try { return new Date(iso).toLocaleTimeString(sprog === "en" ? "en-GB" : "da-DK", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Copenhagen" }); } catch (_e) { return ""; } }
  function tal(v){ return (typeof v === "number" && isFinite(v)) ? v : 0; }
  /* Pointet som i StreakTennis' kampTavle: 0 · 15 · 30 · 40 · lige = 40 · fordel = A · i tiebreak tallet selv */
  function pv(a, b, tb){
    a = tal(a); b = tal(b);
    if (tb) return String(a);
    if (a >= 3 && b >= 3) return a === b ? "40" : (a > b ? "A" : "–");
    return ["0", "15", "30", "40"][a] || "40";
  }
  function tavle(x){
    var o = O(), st = x.stilling || {}, tb = st.tiebreak === true;
    var hist = Array.isArray(st.saetHistorik) ? st.saetHistorik : [];
    var p = Array.isArray(st.partier) ? st.partier : [0, 0], pt = Array.isArray(st.point) ? st.point : [0, 0];
    var saet = hist.map(function(h){ var d = String(h).split("-"); return [d[0] || "", d[1] || ""]; });
    function raekke(i, navn, klasse){
      var h = '<div class="raekke ' + klasse + '"><div class="navn"><i class="serv' + ((st.server === true) === (i === 0) ? '' : ' ikke') + '"></i><span>' + esc(navn) + '</span></div><div class="tal">';
      saet.forEach(function(s){ h += '<span class="c">' + esc(s[i]) + '</span>'; });
      h += '<span class="c parti">' + tal(p[i]) + '</span><span class="c point">' + esc(pv(pt[i], pt[1 - i], tb)) + '</span></div></div>';
      return h;
    }
    return '<div class="kamp" data-live-kamp="1"><div class="kamphoved"><span class="turn">' + (x.turnering ? '🏆 ' + esc(x.turnering) : esc(o.kamp)) + '</span>' +
      (x.startet ? '<span class="tid">' + esc(o.startet.replace("{t}", kl(x.startet))) + '</span>' : '') + '</div>' +
      '<div class="tavle">' + raekke(0, x.fornavn || "–", "spil") + raekke(1, o.modst, "modst") + '</div>' +
      (tb ? '<span class="tb">' + esc(o.tb) + '</span>' : '') + '</div>';
  }
  function besked(t){ app.innerHTML = '<div class="besked"><p>' + esc(t) + '</p></div>'; }
  function tegn(){
    var o = O();
    document.documentElement.lang = sprog;
    document.getElementById("livetekst").textContent = o.live;
    document.querySelector(".livemaerke").style.opacity = data && !(fejl && fejl.slags === "ikke") ? "1" : ".35";   /* en slukket skærm blinker ikke LIVE */
    document.getElementById("fodtekst").textContent = o.fod;
    document.getElementById("qrtekst").textContent = o.qr;
    document.getElementById("klub").textContent = data && data.klub ? data.klub : "";
    if (data && data.klub) document.title = "Live · " + data.klub;
    var st = document.getElementById("stempel");
    st.className = ""; st.textContent = sidst ? o.sidst.replace("{t}", kl(sidst)) : "";
    if (fejl && fejl.slags === "ikke") { data = null; document.getElementById("klub").textContent = ""; return besked(o.ikke); }
    if (!data) {
      if (fejl) return besked(fejl.slags === "net" ? o.net : o.fejl.replace("{s}", fejl.s));
      return besked(o.henter);
    }
    if (fejl) { st.className = "advar"; st.textContent = o.gammel.replace("{t}", kl(sidst)); }
    var k = Array.isArray(data.kampe) ? data.kampe : [];
    if (!k.length) { app.innerHTML = '<div class="tom" data-live-tom="1"><h2>' + esc(o.tomH) + '</h2><p>' + esc(o.tomP) + '</p></div>'; return; }
    app.innerHTML = '<div class="gitter">' + k.map(tavle).join("") + '</div>';
  }
  function ur(){ var e = document.getElementById("ur"); if (e) e.textContent = kl(new Date().toISOString()); }
  function hent(){
    var k = token();
    if (!k) { besked(O().link); return; }
    if (henter) return; henter = true;
    var ctl = window.AbortController ? new AbortController() : null, stop = setTimeout(function(){ if (ctl) ctl.abort(); }, 15000);
    fetch(URL_LIVE, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ handling: "live", token: k }), signal: ctl ? ctl.signal : undefined })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, status: r.status, d: d }; }); })
      .then(function(x){
        clearTimeout(stop); henter = false;
        if (x.ok) { data = x.d; sidst = new Date().toISOString(); fejl = null; return tegn(); }
        fejl = x.status === 404 ? { slags: "ikke" } : { slags: "fejl", s: x.status }; tegn();
      })
      .catch(function(){ clearTimeout(stop); henter = false; fejl = { slags: "net" }; tegn(); });
  }
  /* En skærm på væggen: ingen pil, der står midt i billedet, og skærmen må ikke gå i dvale (hvor browseren tillader det) */
  var _pil = null;
  function pil(){ document.body.classList.remove("stille"); clearTimeout(_pil); _pil = setTimeout(function(){ document.body.classList.add("stille"); }, 3000); }
  document.addEventListener("mousemove", pil); pil();
  function vaagen(){ try { if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").catch(function(){}); } catch (_e) {} }
  document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") { vaagen(); hent(); } });
  window.addEventListener("hashchange", function(){ sprog = param("l") === "en" ? "en" : "da"; data = null; fejl = null; sidst = null; tegn(); hent(); });
  sprog = param("l") === "en" ? "en" : "da";
  ur(); setInterval(ur, 15000);
  tegn(); vaagen(); hent();
  setInterval(function(){ if (document.visibilityState === "visible") hent(); }, HVERT_MS);
})();
</script>
</body>
</html>
