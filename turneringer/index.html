<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Oskar · turneringer og holdkampe</title>
<style>
:root{--is:#A8DFF4;--s:#d7b04f;--d:#c9e05a;--m:#79b8e8;--t:#b79cf0;--h:#5fc9b0;--bg:#121922;--flade:#19222d;--linje:#2a3543;--tekst:#eef1f5;--daemp:#8f9cad;--guld:#c9a34a;--bold:#d6e85a;--rod:#ec8a72}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tekst);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 16px 56px}
.wrap{max-width:760px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;padding-top:22px}
.topbar svg{width:34px;height:34px;flex:none}
.mark{font-size:11.5px;letter-spacing:3px;color:var(--tekst);font-weight:600}
.mark b{color:var(--is);font-weight:700}
.sprog{margin-left:auto;display:flex;gap:2px;background:var(--flade);border-radius:8px;padding:3px}
.sprog button{background:none;border:0;color:var(--daemp);font:600 12px/1 inherit;font-family:inherit;padding:6px 9px;border-radius:6px;cursor:pointer}
.sprog button.aktiv{background:var(--linje);color:var(--tekst)}
.helt{position:relative;margin:18px 0 8px;padding:26px 20px 24px;background:var(--flade);border-radius:14px;overflow:hidden}
.helt::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.07);border-radius:4px;pointer-events:none}
.helt::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;border-left:2px solid rgba(255,255,255,.07)}
.helt>*{position:relative;z-index:1}
.kicker{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--bold);font-weight:700}
.tal{font-size:64px;line-height:1;font-weight:800;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.tal small{font-size:20px;font-weight:600;color:var(--daemp);margin-left:6px}
.hvad{font-size:18px;font-weight:700}
.hvor{color:var(--daemp)}
h1{font-size:15px;font-weight:600;color:var(--daemp);margin:4px 0 0}
h2{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--guld);margin:40px 0 14px;font-weight:700}
/* saesonbaand */
.baand{position:relative;height:30px;border-bottom:1px solid var(--linje);margin-bottom:8px}
.uge{position:absolute;bottom:-18px;font-size:11px;color:var(--daemp);transform:translateX(-50%)}
.turn{position:relative;margin:26px 0 6px}
.spor{position:relative;height:10px;background:var(--flade);border-radius:5px}
.blok{position:absolute;top:0;height:10px;border-radius:5px;background:var(--guld)}
.blok.lys{background:var(--bold)}
.turn .navn{font-weight:700;margin-top:6px}
.turn .info{color:var(--daemp);font-size:14px}
.idag{position:absolute;top:-6px;bottom:-6px;border-left:2px dashed var(--rod)}
/* trapper */
.raekke{margin:18px 0 30px}
.raekke h3{font-size:17px}
.raekke .sub{color:var(--daemp);font-size:14px;margin-bottom:12px}
.trappe{display:flex;align-items:flex-end;gap:6px;height:150px}
.trin{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.blk{border-radius:6px 6px 0 0;background:var(--flade);border:1px solid var(--linje);border-bottom:none;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-weight:800;font-size:14px;color:var(--daemp)}
.trin.fast .blk{background:var(--guld);border-color:var(--guld);color:#1a1405}
.trin.fri .blk{background:transparent;border-style:dashed;color:var(--daemp)}
.trin.top .blk{color:var(--bold)}
.dt{font-size:11.5px;color:var(--daemp);text-align:center;margin-top:6px;line-height:1.3}
.dt b{color:var(--tekst);font-weight:600;display:block}
.fod-trappe{border-top:1px solid var(--linje)}
.modst{font-size:14px;color:var(--daemp);margin-top:12px}
.modst b{color:var(--tekst);font-weight:600}
/* dagliste */
.dag{border-top:1px solid var(--linje);padding:12px 0}
.dato{font-weight:700;margin-bottom:4px}
.kamp{display:grid;grid-template-columns:52px 1fr;gap:0 12px;padding:4px 0}
.kamp .t{font-weight:700;font-variant-numeric:tabular-nums}
.kamp .s{color:var(--daemp);font-size:14px}
.kamp.mulig .t,.kamp.mulig .k{color:var(--daemp);font-weight:500}
.kamp.fast .k{font-weight:700}
.kamp.fast .k::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bold);margin-right:7px;vertical-align:1px}
.kamp.forbi{opacity:.4}
.adv{grid-column:2;color:var(--rod);font-size:14px}
.valg{border-left:3px solid var(--rod);padding:8px 0 8px 14px;margin:10px 0;font-size:14.5px}
.valg b{color:var(--rod)}
.menu{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--linje);display:flex;gap:18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu a{color:var(--daemp);text-decoration:none;font-size:14px;font-weight:600;padding:4px 0;border-bottom:2px solid transparent}
.menu a.aktiv{color:var(--tekst);border-bottom-color:var(--guld)}
section{scroll-margin-top:56px}
.turn a{color:inherit;text-decoration:none}
.tur{border-top:1px solid var(--linje);padding:18px 0 6px}
.tur h3{font-size:20px;line-height:1.25}
.tur .per{color:var(--bold);font-weight:700;margin:4px 0 10px}
.fakta{display:grid;grid-template-columns:108px 1fr;gap:6px 12px;font-size:14.5px}
.fakta dt{color:var(--daemp)}
.tur .link{display:inline-block;margin-top:12px;color:var(--guld);font-size:14px}
.prik{position:absolute;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--tekst);transform:translateX(-50%)}
.hk{display:grid;grid-template-columns:96px 1fr;gap:2px 12px;padding:10px 0;border-top:1px solid var(--linje)}
.hk .d{font-weight:700;font-variant-numeric:tabular-nums}
.hk .d small{display:block;color:var(--daemp);font-weight:500;font-size:13px}
.hk .m{font-weight:600}
.hk .s{color:var(--daemp);font-size:14px}
.hk .adv{grid-column:2}
.hold h3{font-size:18px;margin-top:22px}
.hold .sub{color:var(--daemp);font-size:14px;margin-bottom:6px}
.tur .adv2{color:var(--rod);font-size:14px;margin-top:10px}
/* tal */
.sk-tal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk-tal div{background:var(--flade);border-radius:12px;padding:12px 10px 10px}
.sk-tal b{display:block;font-size:30px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.sk-tal span{display:block;font-size:12px;color:var(--daemp);margin-top:6px;line-height:1.25}
.sk-tal .sk-r b{color:var(--rod)}
/* varmekort */
.sk-varme{display:grid;grid-template-columns:repeat(17,1fr);gap:3px}
.sk-varme .sk-c{aspect-ratio:1/1.5;border-radius:4px;background:var(--flade);position:relative}
.sk-varme .sk-c i{position:absolute;inset:0;border-radius:4px;background:var(--s)}
.sk-varme .sk-c.sk-nu{outline:2px solid var(--rod);outline-offset:1px}
.sk-uger{display:grid;grid-template-columns:repeat(17,1fr);gap:3px;margin-top:5px;font-size:9.5px;color:var(--daemp);text-align:center}
.sk-mdr{display:flex;justify-content:space-between;font-size:11px;color:var(--daemp);margin-top:6px}
/* metrokort */
.sk-legende{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--daemp);margin-bottom:10px}
.sk-legende span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:3px;background:var(--c)}
.sk-kort{position:relative}
.sk-hoved,.sk-rk{display:grid;grid-template-columns:64px repeat(5,1fr)}
.sk-hoved{position:sticky;top:46px;z-index:3;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--linje)}
.sk-hoved div{font-size:11px;font-weight:700;text-align:center;color:var(--c,var(--daemp));line-height:1.2}
.sk-rk{min-height:66px;position:relative}
.sk-rk.sk-kol{background:linear-gradient(90deg,rgba(239,139,116,.13),rgba(239,139,116,.04))}
.sk-rk.sk-mnd{border-top:1px solid var(--linje)}
.sk-dt{padding:12px 6px 0 0;font-size:12.5px;line-height:1.2}
.sk-dt b{display:block;font-size:17px;font-weight:800}
.sk-dt small{color:var(--daemp)}
.sk-ln{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 0}
.sk-ln::before{content:"";position:absolute;left:50%;width:4px;margin-left:-2px;background:var(--c);top:var(--top,50%);bottom:var(--bund,50%);opacity:.85;border-radius:2px}
.sk-ln.sk-ingen::before{display:none}
.sk-st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.sk-pkt{width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.sk-st.sk-mulig .sk-pkt{background:var(--bg);border:3px solid var(--c)}
.sk-st.sk-blok .sk-pkt{width:26px;height:14px;border-radius:7px}
.sk-lbl{font-size:10.5px;font-weight:700;line-height:1.15;text-align:center;margin-top:2px;background:var(--bg);padding:0 3px;border-radius:3px}
.sk-lbl small{display:block;font-weight:500;color:var(--daemp)}
.sk-st.sk-mulig .sk-lbl{color:var(--daemp)}
.sk-dt .sk-mn{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--daemp);margin-bottom:4px}
.sk-dt em{display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--rod);margin-top:3px;line-height:1.15}
.sk-mndnavn{grid-column:1/-1;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--daemp);padding:10px 0 2px}
.sk-kolnote{position:absolute;right:0;bottom:2px;font-size:10px;color:var(--rod);font-weight:700}
@media (max-width:420px){.sk-hoved,.sk-rk{grid-template-columns:52px repeat(5,1fr)}.sk-dt b{font-size:15px}.sk-lbl{font-size:9.5px}.sk-tal b{font-size:26px}}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--linje);color:var(--daemp);font-size:12.5px}
@media (max-width:420px){.tal{font-size:54px}.trappe{gap:4px;height:136px}.blk{font-size:12px}.dt{font-size:10.5px}}
</style>
</head>
