<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>StreakTennis</title>
<style>
  :root{--guld:#F0CF61;--is:#9FD8E8;--kridt:#EDF2FA;--grus:#2E56D6;--daempet:#8B99B5;--dyb:#070D19;--kant:#22304d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--dyb);color:var(--kridt);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px 18px;text-align:center}
  .m{max-width:340px}
  .flam{font-size:64px;line-height:1;margin-bottom:8px}
  h1{font-size:24px;font-weight:900;letter-spacing:4px;color:var(--guld);margin:0}
  .u{font-size:12px;letter-spacing:3px;color:var(--is);margin:2px 0 20px}
  p{font-size:14px;line-height:1.55;color:var(--kridt);margin:0 0 18px}
  .lille{font-size:12px;color:var(--daempet);line-height:1.5}
  a.knap{display:block;background:var(--grus);color:#fff;text-decoration:none;
         border-radius:14px;padding:16px 18px;font-size:16px;font-weight:800;
         min-height:54px;line-height:22px}
</style>
</head>
<body>
<div class="m">
  <div class="flam">🔥</div>
  <h1>STREAK</h1>
  <div class="u">TENNIS</div>
  <p>Appen er flyttet herind.</p>
  <a class="knap" href="./StreakTennis/">Åbn StreakTennis →</a>
  <p class="lille" style="margin-top:16px">
    Har du brugt appen på denne telefon før, følger dine træninger,
    kampe og din streak automatisk med. Du bliver spurgt første gang.
  </p>
</div>
<script>
// ⭐ DØREN, IKKE EN TOM FIL.
//
// Nicolai 25/8: "Skal vi ikke bare ligge en tom index fil der? … ingen
// grund til at vedligeholde den mere." Han har ret i, at forsiden ikke
// skal vedligeholdes. Men en TOM fil er en blindgyde for enhver, der har
// den gamle app på hjemmeskærmen — og det har mindst én familie.
//
// Denne side vedligeholdes aldrig. Den peger.
//
// ⚠️ OG DEN RYDDER OP EFTER DEN GAMLE APP.
// Roden registrerede en service worker med scope "/" — den styrer HELE
// domænet, også /StreakTennis/. Cachen "teamoskar-v2" ligger stadig på
// folks telefoner og er network-first med offline-fallback: fejler ét
// netværkskald, serverer den en forældet app-udgave lydløst. Præcis dét
// skete 18/8 med v1-cachen.
//
// Efterlader vi bare en tom fil, bliver den gamle SW og dens cache
// liggende for evigt. Derfor afmelder vi den her — én gang, på vejen ud.
(function(){
  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){
          // KUN rodens egen. StreakTennis' egen (scope /StreakTennis/)
          // skal blive — den er appens offline-kopi.
          var s = String(r.scope || "");
          if (!/\/StreakTennis\/?$/.test(s)) r.unregister();
        });
      }).catch(function(){});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function(n){
        n.forEach(function(k){ if (/^teamoskar/.test(k)) caches.delete(k); });
      }).catch(function(){});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
