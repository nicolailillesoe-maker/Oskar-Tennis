<meta charset="utf-8">
<title>StreakTennis — Træner</title>
<meta name="theme-color" content="#101B26">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<style>
:root{--nat:#111C33;--dyb:#070D19;--kort:rgba(255,255,255,.05);--kant:rgba(255,255,255,.12);--kant2:#31415F;--flade:#1B2A44;--kridt:#EDF2FA;--daempet:#8B99B5;--is:#9FD8E8;--grus:#2E56D6;--gruslys:#7B9BFF;--guld:#F0CF61;--vundet:#22995A;--tabt:#D2484E;--tekst2:#B9C6D8;--fod:#4A5A78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Helvetica Neue',Arial,sans-serif;background:radial-gradient(120% 55% at 50% -8%,#14264A 0%,#0B1220 55%) fixed #0B1220;color:var(--kridt);font-size:15px;line-height:1.5;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
a{color:var(--is)}a:hover{color:#C6EAF5}
#app{max-width:520px;margin:0 auto;padding:16px 16px 20px}
h1{font-size:20px;margin:2px 0}
h3{font-size:14px;margin:0 0 6px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:0;z-index:60;background:radial-gradient(120% 55% at 50% -8%,#14264A 0%,#0B1220 55%) fixed #0B1220;margin:0 -14px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brandlogo{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(240,207,97,.45),0 4px 12px rgba(0,0,0,.4)}
.brandtxt{display:flex;flex-direction:column;gap:1px}
.wordmark{font-size:11px;letter-spacing:4px;font-weight:700;color:var(--guld);line-height:1}
.brandby{font-size:9px;letter-spacing:.6px;font-weight:600;color:var(--daempet);line-height:1}
.brandby b{color:var(--is)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--daempet);text-transform:uppercase}
.kort{background:var(--kort);border:1px solid var(--kant);border-radius:18px;padding:14px 16px;margin-bottom:10px;backdrop-filter:blur(8px)}
.lille{font-size:12px;color:var(--daempet);margin:2px 0}
.raekke{display:flex;gap:8px}
.knap{flex:1;padding:12px;border:none;border-radius:14px;background:var(--flade);color:var(--kridt);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.knap:active{transform:translateY(1px)}
.knap.til{background:var(--is);color:#0B1220}
.knap.valg{background:transparent;border:1px solid var(--kant);color:var(--daempet)}
/* Gulvet gaelder ogsaa de smaa knapper i kort-hjoerner. */
.knap{min-height:44px}
.knap.valg.til{background:rgba(159,216,232,.1);border-color:var(--is);color:var(--is)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--kant)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#9FD8E8,#4B17B6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;color:#0B1220}
/* Apple HIG: mindst 44px beroeringsflade. */
.fane-rk{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.fane-rk button{flex:none;padding:8px 13px;border:1px solid var(--kant);border-radius:10px;background:transparent;color:var(--daempet);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.fane-rk button.aktiv{background:rgba(159,216,232,.1);color:var(--is);border-color:var(--is)}
.streak-chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:9px;background:var(--flade)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spiller-rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--kant);cursor:pointer}
.spiller-rk:first-of-type{border-top:none}
.badge-ai{background:linear-gradient(90deg,var(--is),var(--gruslys));color:var(--dyb);font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;letter-spacing:.5px}
textarea{width:100%;background:var(--dyb);border:1px solid var(--kant);border-radius:14px;color:var(--kridt);padding:10px;font-family:inherit;font-size:13px;resize:vertical;line-height:1.55}
.proto-note{background:rgba(240,207,97,.1);border:1px solid rgba(240,207,97,.5);border-radius:14px;padding:8px 11px;font-size:11.5px;color:var(--guld);margin-bottom:12px}
.medalje{font-size:15px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--kant);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;box-shadow:0 0 14px -3px currentColor}
.dot.valgt{border-color:var(--kridt);box-shadow:0 0 0 2px #0B1220,0 0 0 4px currentColor,0 0 18px currentColor}
.skala-band{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px}
.skala-cirkel{width:15px;height:15px;border-radius:50%;flex:none;box-shadow:0 0 10px -2px currentColor}
.logo-rk{display:flex;align-items:center;gap:9px;margin-bottom:12px}
/* Designstandard v1.0 regel 3: alle fliser lige store. grid-auto-rows:1fr
   goer raekkerne ens uanset tekstlaengde — ingen manuel hoejde. */
.dev-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:12px;margin-top:12px}

// Alt gemmes lokalt under tp-*. Der findes ingen backend endnu; når Spor 2
// kommer, skiftes disse fire kald ud — resten af appen skal ikke røres.
const lager = {
  hent: (n, standard) => { try { const v = localStorage.getItem("tp-" + n);
    return v === null ? standard : JSON.parse(v); } catch (e) { return standard; } },
  gem: (n, v) => { try { localStorage.setItem("tp-" + n, JSON.stringify(v)); }
    catch (e) { console.warn("kunne ikke gemme", n); } },
};

//   KONFIG.klub stod hårdkodet på «Tennisklubben». Nøglebunden har hele

//   øverst på sin egen platform, og familiernes evalueringsbrev ville
//   have båret samme navn. Princip 70: hentet, aldrig brugt.
try { const _kn = lager.hent("klubnavn", ""); if (_kn) KONFIG.klub = _kn; } catch (_e) {}

// DET DELTE LAG · trænerens side
// Skriver vurderinger og ugefokus op, henter hele holdet ned.
// v3.1.0 (29/8): TRAENERNOEGLEN giver adgang — motoren v2.17.0 skelner nu
// mellem traenerens noegle og familiens. Spillerne identificeres med et
// HAANDTAG (16 hex fra hent-hold), aldrig med deres spillernoegle: den
// forlader ikke laengere serveren, og platformen udgiver sig ikke
// laengere for spilleren, naar vurderinger sendes (vurdering-gem).
// ══════════════════════════════════════════════════════════════════════
const SYNC_URL = "https://dihzphfsffritfszqkko.supabase.co/functions/v1/spiller-sync";
const EVAL_URL = "https://dihzphfsffritfszqkko.supabase.co/functions/v1/analyse-evaluering";
// ⭐⭐ v3.4.0 · NOEGLEBUNDEN HAR FAAET SIN EGEN MOTOR (30/8).
//   `spiller-sync`s tre noegle-handlinger haardkoder `traener:false` og
//   kan hverken se, udstede eller spaerre traenernoegler. `klub-noegler`
//   kender de tre roller — admin · traener · spiller — og er lille nok
//   til at efterproeves med oejet. Motoren blev maalt paa 14 veje 30/8.
const NOEGLER_URL = "https://dihzphfsffritfszqkko.supabase.co/functions/v1/klub-noegler";

// Samme form som sync(), men mod noeglebunden. Klubnoeglen er identiteten;
// der sendes ALDRIG en spillernoegle herfra.
async function noegleKald(handling, krop) {
  const klub = lager.hent("klubkode", "");
  if (!klub) return { fejl: "mangler-klubkode" };
  const st = new AbortController(); const ur = setTimeout(() => st.abort(), 20000);
  try {
    const r = await fetch(NOEGLER_URL, { method: "POST",
      headers: { "content-type": "application/json", "x-klub-noegle": klub },
      body: JSON.stringify({ handling, ...krop }), signal: st.signal });
    clearTimeout(ur);
    const d = await r.json().catch(() => ({}));
    // ⭐ ÉN dør ind: hver gang nøglebunden svarer, lærer platformen
    //   klubbens rigtige navn — uanset hvilken handling der blev kaldt.
    if (r.ok && d && d.klub) {
      try { lager.gem("klubnavn", d.klub); KONFIG.klub = d.klub; } catch (_e) {}
    }
    return r.ok ? d : { fejl: d.kode || "netvaerk", status: r.status, t: d.fejl };
  } catch (e) { clearTimeout(ur); return { fejl: "netvaerk" }; }
}

async function sync(handling, krop, spillerNoegle) {
  const klub = lager.hent("klubkode", "");
  if (!klub) return { fejl: "mangler-klubkode" };
  const h = { "content-type": "application/json", "x-klub-noegle": klub };
  if (spillerNoegle) h["x-spiller-noegle"] = spillerNoegle;
  const st = new AbortController(); const ur = setTimeout(() => st.abort(), 20000);
  try {
    const r = await fetch(SYNC_URL, { method: "POST", headers: h,
      body: JSON.stringify({ handling, ...krop }), signal: st.signal });
    clearTimeout(ur);
    const d = await r.json().catch(() => ({}));
    return r.ok ? d : { fejl: d.kode || "netvaerk", status: r.status, detaljer: d.detaljer };
  } catch (e) { clearTimeout(ur); return { fejl: "netvaerk" }; }
}

// Trænerens vurdering af én spiller sendes op med det samme.
// Spillernøglen slås op i den lokale kobling navn → nøgle.
// Områderne oversat til det delte lags sprog. RETTET 19/8 (målt): "spilselv"
// røg før i "traener"-spanden, fordi oversættelsen tjekkede på "selv" —
// spil-selv-scores stod som trænerbane-scores ude hos spilleren.
function omrTilSync(omr) {
  return omr === "fysisk" ? "fysisk" : (omr === "spilselv" || omr === "selv" ? "selv" : "traener");
}

// v3.1.0 · ET HAANDTAG ER 16 HEX; alt andet er en gammel raa noegle.
// Motoren tager begge i en overgangsperiode — feltnavnet afgoer det.
function spillerRef(vaerdi) {
  return /^[0-9a-f]{16}$/.test(String(vaerdi || "")) ? { haandtag: vaerdi } : { spillernoegle: vaerdi };
}

async function sendVurdering(spillerNavn) {
  const n = (S.noegler || {})[spillerNavn];
  if (!n) return;
  // Hændelser, aldrig celler (19/8): alle vurderinger rejser (loft 300; vagten
  // tager højst 400). Fornavnet er FAMILIENS felt — der sendes serverens eget
  // navn retur (rundtur), så trænerens gem aldrig overskriver familiens valg.
  const mine = S.vurderinger.filter(v => v.spiller === spillerNavn)
    .map(v => ({ d: v.dato, o: omrTilSync(v.omraade), s: v.score, f: v.fokus || null }))
    .slice(-300);
  // v3.1.0 · TRAENERENS EGEN VEJ. Foer rejste vurderingerne via familiens
  // "gem" med spillerens raa noegle i hovedet — platformen UDGAV sig for
  // spilleren. Nu bruges vurdering-gem med klubbens noegle og haandtaget.
  // Fornavns-rundturen er vaek: handlingen kan slet ikke roere fornavnet.
  const krop = Object.assign(spillerRef(n), { vurderinger: mine, fokuspunkter: S.fokuspunkter[spillerNavn] || [] });
  const r = await sync("vurdering-gem", krop);
  S.syncBesked = r.fejl ? { fejl: true, t: syncFejltekst(r) } : { fejl: false, t: "Sendt til " + spillerNavn.split(" ")[0] + " ✓" };
  render();
}

// ÆGTE AI-UDKAST (19/8, lukker LLM-oprustningskortets punkt 5): rundens
// hændelser — trænerens pas-scores, spillerens egne domme, kampresuméer,
// træningsugetal og fokus — sendes som TAL til analyse-evaluering, og
// udkastet kommer tilbage. Ingen fritekst sendes; teksten SKABES af kaldet.
// Fejler noget som helst, falder vi tilbage til den lokale skabelon.
async function hentEvalUdkast(n) {
  S.kvartalUdkast = n; S.kvartalAI = null; S.kvartalNote = null;
  const klub = lager.hent("klubkode", "");
  const noegle = (S.noegler || {})[n];
  if (!klub) { S.kvartalNote = "Ingen klubkode — skabelonen vises."; render(); return; }
  S.kvartalHenter = true; render();
  try {
    const idag = new Date().toISOString().slice(0, 10);
    const d = DATA.spillere[n] || {};
    const sp = {
      fornavn: (noegle && (S.srvNavne || {})[noegle]) || n.split(" ")[0],
      vurderinger: S.vurderinger.filter(function(v){ return v.spiller === n; })
        .map(function(v){ return { d: v.dato, o: omrTilSync(v.omraade), s: v.score, f: v.fokus || null }; }).slice(-400),
      selvvurderinger: (Array.isArray(d.selvvurderinger) ? d.selvvurderinger : [])
        .map(function(v){ return { d: v.d, o: v.o, s: v.s, f: v.f || null }; }).slice(-400),
      kampresume: (Array.isArray(d.kampResume) ? d.kampResume : []).slice(0, 30)
        .map(function(k){ return { d: String(k.d || "").slice(0, 10), res: k.res || "", vundet: !!k.vundet,
          balance: (typeof k.balance === "number" ? k.balance : undefined),
          bolde: (typeof k.bolde === "number" ? k.bolde : undefined),
          turnering: k.turnering || undefined }; }),
      traeningsresume: (Array.isArray(d.trResume) ? d.trResume : []).slice(0, 12)
        .map(function(w){ return { u: w.u, t: w.t || 0, f: w.f || 0, m: w.m || 0 }; }),
      fokuspunkter: (S.fokuspunkter[n] || []).slice(0, 10),
      ugefokus: Object.keys(S.ugefokus || {}).filter(function(u){ return S.ugefokus[u]; }).sort().slice(-15)
        .map(function(u){ return { u: u, o: S.ugefokus[u] }; }),
    };
    var grp = null; Object.keys(DATA.grupper).forEach(function(g){ if (DATA.grupper[g].spillere.indexOf(n) !== -1) grp = g; });
    if (grp) sp.gruppe = grp;
    var forrige = (S.evalueringer || {})[n];
    if (forrige && forrige.dato && forrige.dato < idag) sp.periodeFra = forrige.dato;
    const styring = new AbortController();
    const ur = setTimeout(function(){ styring.abort(); }, 90000);
    const r = await fetch(EVAL_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "x-klub-noegle": klub },
      body: JSON.stringify({ sprog: "da", spiller: sp }),
      signal: styring.signal,
    });
    clearTimeout(ur);
    const svar = await r.json().catch(function(){ return {}; });
    if (r.ok && svar && svar.evaluering) S.kvartalAI = svar.evaluering;
    else S.kvartalNote = "AI-udkastet kunne ikke hentes (" + (svar.kode || r.status) + ") — skabelonen vises.";
  } catch (e) {
    S.kvartalNote = "Ingen forbindelse — skabelonen vises.";
  }
  S.kvartalHenter = false;
  render();
}

// Tilmeldinger + truppens servertal. Egen funktion (19/8): kortet bor nu
// under Indstillinger, og auto-Tjek ved sideindlæsning kalder direkte —
// aldrig via et knap-klik, der forudsætter en bestemt skærm.
function hentTilmeldinger(){

    if (S.tilmHenter) return;
    if (!lager.hent("klubkode","")) { S.syncBesked={fejl:true,t:"Indtast klubkoden f\u00f8rst."}; render(); return; }
    S.tilmHenter = true; S.syncBesked = null; render();

    erBruger:false, gruppe:gruppe, fysStreak:0, tennisStreak:0, streak:0, vurdering:{}, kampe:0, sejre:0,

function byggTrup(){

  S.truppen.forEach(function(p){

    if (spillere[p.navn]) return;
    grupper[gr].spillere.push(p.navn);
    spillere[p.navn] = nySpiller(p.navn, gr);
    if (p.noegle) { S.noegler = S.noegler || {}; S.noegler[p.navn] = p.noegle; }
  });
  DATA.grupper = grupper; DATA.spillere = spillere;
  if (DATA.traenere && DATA.traenere[0]) DATA.traenere[0].grupper = raekke;
  if (DATA.traenere && DATA.traenere[1]) DATA.traenere[1].grupper = [];
  S.spiller = raekke.length ? grupper[raekke[0]].spillere[0] : S.spiller;

}

// ISO-ugenummer — ugefokus gemmes pr. uge, så historikken kan læses bagud
function ugeNoegle(d) {
  d = d ? new Date(d) : new Date();
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const nytaar = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const uge = Math.ceil(((t - nytaar) / 86400000 + 1) / 7);
  return t.getUTCFullYear() + "-" + String(uge).padStart(2, "0");
}

    const g = DATA.grupper[gnavn], sp = g.spillere.map(n=>DATA.spillere[n]);
    const snit = sp.reduce((a,s)=>a+snitVurd(s),0)/sp.length;
    h += '<div class="kort"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">' +
      '<h3>'+esc(gnavn)+'</h3><span style="font-size:11px;font-weight:800;background:var(--kant);color:var(--is);padding:3px 9px;border-radius:10px">'+g.aargang+'</span></div>' +
      '<p class="lille">'+sp.length+' spillere · snit '+snit.toFixed(1)+'/10 · fælles mål pr. '+g.aargang+'</p>';
    sp.forEach(function(s){
      const sn = snitVurd(s), b = skala(Math.round(sn));
      h += '<div class="spiller-rk" data-act="spiller-detalje" data-v="'+esc(s.navn)+'">' +
        '<div class="avatar" style="width:32px;height:32px;font-size:13px;'+(s.erBruger?'background:var(--is);color:var(--nat)':'')+'">'+init(s.navn)+'</div>' +
        '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:700">'+esc(s.navn)+(s.erBruger?' ⭐':'')+'</div>' +
        '<div class="lille">'+(s.rang?'DTF #'+s.rang+' · ':'')+s.kampe+' kampe · sidst: '+s.sidsteTraening+'</div></div>' +
        '<div style="display:flex;align-items:center;gap:6px"><span style="width:11px;height:11px;border-radius:50%;background:'+b.farve+';display:inline-block"></span><b style="font-size:13px">'+sn.toFixed(1)+'</b></div>' +
        '<span style="color:var(--daempet)">›</span></div>';
    });
    h += '</div>';
  });
  return h;
}

function spillerDetalje(navn){
  const s = DATA.spillere[navn];
  let h = '<button class="knap valg" style="margin-bottom:12px;flex:none;padding:8px 14px" data-act="luk-spiller">‹ Tilbage</button>';
  h += '<div class="kort"><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">' +
    '<div class="avatar" style="width:48px;height:48px;font-size:19px">'+init(navn)+'</div>' +
    '<div><h1 style="margin:0;font-size:19px">'+esc(navn)+'</h1><p class="lille">'+esc(s.gruppe)+(s.rang?' · DTF #'+s.rang:'')+(s.wtn?' · WTN '+s.wtn:'')+'</p></div></div>';
  h += '<div class="grid2" style="margin-top:8px">' +
    miniIkon("Kampe", s.kampe, IKON.ketcher) +
    miniRing("Sejrsrate", (s.kampe?Math.round(s.sejre/s.kampe*100):0)) +
    miniIkon("Træninger i træk", s.streak || 0, IKON.loeber) +
    (s.trResume && s.trResume.length
      ? miniIkon("Pas denne uge", (s.trResume[0].t||0)+(s.trResume[0].f||0), IKON.bold)
      : miniIkon("Træninger", s.traeningerKvartal, IKON.bold)) + '</div></div>';

  // ── PAS I KVARTALET (20/8, F13). Tælleren `traeningerKvartal` er et
// DEMO-felt: den står 0 for enhver rigtig spiller og opdateres aldrig.
// Sandheden ligger i `trResume` — uge-tallene fra spillerens egen synk,
// højst 12 uger = netop et kvartal. Tennis + fysisk, som TRÆN-fanen selv
// regner dem. Findes der ingen synk endnu, falder vi tilbage til feltet,
// så demo-truppen ser ud som før.
// ── TRÆNING · SENESTE UGER (19/8) — omfanget fra spillerens egen log:
  // antal tennis, antal fys og timer pr. uge. Aldrig noter, aldrig indhold.
  if (s.trResume && s.trResume.length) {
    h += '<div class="kort"><div style="font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--grus);margin-bottom:2px">\ud83d\udcc5 TR\u00c6NING \u00b7 SENESTE UGER</div>' +
      '<p class="lille" style="margin:0 0 4px">Fra spillerens egen registrering \u2014 antal og tid, aldrig indhold.</p>';
    s.trResume.slice(0, 8).forEach(function(w){
      var timer = (Math.round((w.m || 0) / 6) / 10).toFixed(1).replace(".", ",");
      var ialt = (w.t || 0) + (w.f || 0);
      h += '<div style="display:flex;align-items:center;gap:8px;border-top:1px solid var(--kant);padding:6px 0">' +
        '<span style="flex:none;width:52px;font-size:12px;font-weight:700">Uge ' + (w.u % 100) + '</span>' +
        '<span style="flex:1;font-size:12.5px">\ud83c\udfbe ' + (w.t || 0) + ' \u00b7 \ud83d\udcaa ' + (w.f || 0) + ' \u00b7 ' + timer + ' t</span>' +
        '<span style="flex:none;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;background:var(--flade);color:' + (ialt >= 6 ? 'var(--vundet)' : ialt >= 3 ? 'var(--guld)' : 'var(--daempet)') + '">' + ialt + ' pas</span></div>';
    });
    h += '</div>';
  }

  // ── SPILLERNØGLE-kortet FJERNET 19/8 (Nicolai): spilleropsætning bor
  // under Indstillinger → MIN TRUP, hvor gruppe og nøgle nu kan rettes direkte.
  const minN = (S.noegler||{})[navn];
  if (!minN) h += '<p class="lille" style="margin:0 0 8px">\ud83d\udd11 Ingen n\u00f8gle \u2014 vurderinger bliver p\u00e5 denne enhed. N\u00f8glen s\u00e6ttes under \u2699 Indstillinger \u2192 MIN TRUP.</p>';

  // ── SENESTE KAMPE (19/8) · tr\u00e6nerens weekend-kig: hvordan gik det?
  // Fra kampresum\u00e9et \u2014 fem tal pr. kamp, aldrig boldene.
  if (s.kampResume && s.kampResume.length) {
    h += '<div class="kort"><div style="font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--grus);margin-bottom:2px">\ud83c\udfbe SENESTE KAMPE</div>' +
      '<p class="lille" style="margin:0 0 4px">Resultat og balance (skabte minus for\u00e6rede point) \u2014 fra spillerens synk.</p>';
    s.kampResume.slice(0, 10).forEach(function(k){
      var bal = (typeof k.balance === "number") ? k.balance : null;
      h += '<div style="display:flex;align-items:center;gap:8px;border-top:1px solid var(--kant);padding:7px 0">' +
        '<span style="width:9px;height:9px;border-radius:50%;flex:none;background:' + (k.vundet ? 'var(--vundet)' : 'var(--tabt)') + '"></span>' +
        '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">' + esc(k.res || "\u2014") + '</div>' +
        '<div class="lille">' + esc(String(k.d || "").slice(0, 10)) + (k.turnering ? ' \u00b7 ' + esc(k.turnering) : '') + (k.bolde ? ' \u00b7 ' + k.bolde + ' bolde' : '') + '</div></div>' +
        (bal !== null ? '<span style="flex:none;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;background:var(--flade);color:' + (bal > 0 ? 'var(--vundet)' : bal < 0 ? 'var(--tabt)' : 'var(--daempet)') + '">' + (bal > 0 ? '+' : '') + bal + '</span>' : '') + '</div>';
    });
    h += '</div>';
  }

  // ── VURDERINGER · SENESTE (19/8, flow-designet): trænerens hændelser og
  // spillerens egen dom (fra hans træningslog, via synken) side om side.
  // Det ER Carstens MVP: "spillerens egen vurdering ved siden af".
  (function(){
    const mineV = S.vurderinger.filter(function(v){ return v.spiller === navn; }).slice(-12).reverse();
    if (!mineV.length) return;
    const selvV = Array.isArray(s.selvvurderinger) ? s.selvvurderinger : [];
    h += '<div class="kort"><div style="font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--grus);margin-bottom:2px">📋 VURDERINGER · SENESTE</div>' +
      '<p class="lille" style="margin:0 0 4px">Din score pr. pas · spillerens egen dom samme dag (fra hans træningslog).</p>';
    mineV.forEach(function(v){
      const b = skala(v.score);
      const o = OMRNAVN[v.omraade] || { emoji: "", navn: v.omraade };
      const sMatch = selvV.filter(function(x){ return x.d === v.dato && x.o === omrTilSync(v.omraade); }).slice(-1)[0];
      h += '<div style="display:flex;align-items:center;gap:8px;border-top:1px solid var(--kant);padding:6px 0">' +
        '<span style="flex:none;width:78px;font-size:11.5px;color:var(--daempet)">' + esc(String(v.dato).slice(5)) + '</span>' +
        '<span style="flex:1;font-size:12.5px">' + o.emoji + ' ' + esc(o.navn) + '</span>' +
        '<b style="flex:none;font-size:14px;color:' + b.farve + '">' + v.score + '</b>' +
        (sMatch ? '<span class="lille" style="flex:none;opacity:.75">spiller ' + sMatch.s + '</span>'
                : '<span class="lille" style="flex:none;opacity:.35">–</span>') + '</div>';
    });
    h += '</div>';
  })();

  // FOKUSPUNKTER · faste kategorier, aldrig fritekst.
  // Referat 11/8: "Terkel arbejder med højde over nettet og bedre inside out
  // — og klubbens andre trænere kan se dem." Det løser samtidig Carstens eget
  // spørgsmål: hvorfor gav jeg 3-4, når spilleren selv gav 7-8? Står fokus på
  // forhånd, forklarer vurderingen halvvejs sig selv.
  const mine = S.fokuspunkter[navn] || [];
  const alle = Object.entries(KATEGORIER);
  const navnPaa = id => { for (const [,liste] of alle) { const k = liste.find(x=>x.id===id); if (k) return k.navn; } return id; };
  h += '<div class="kort" style="border-left:3px solid var(--is)">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
      '<div style="font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--grus)">🎯 FOKUSPUNKTER</div>' +
      '<button class="knap valg" style="flex:none;padding:5px 11px;font-size:11px" data-act="fp-aabn" data-v="'+esc(navn)+'">' +
      (S.fpAaben===navn ? 'Færdig' : (mine.length ? 'Ret' : 'Vælg')) + '</button></div>';
  if (S.fpAaben !== navn) {
    h += mine.length
      ? '<div class="flise-grid">' +
        mine.map(id => '<span class="flise-valg til" style="cursor:default">'+esc(navnPaa(id))+'</span>').join('') + '</div>'
      : '<p class="lille" style="margin:6px 0 0">Ingen valgt endnu. Vælg op til tre — de følger spilleren, hvis træneren skifter.</p>';
  } else {
    alle.forEach(([omr, liste]) => {
      const o = UGEOMRAADER.find(x=>x.id===omr);
      h += '<div class="flise-omr">'+o.ikon+' '+o.navn+'</div>' +
        '<div class="flise-grid">' +
        liste.map(k => '<button class="flise-valg'+(mine.includes(k.id)?' til':'')+
          '" data-act="fp-slaa" data-sp="'+esc(navn)+'" data-v="'+k.id+'">'+
          esc(k.navn)+'</button>').join('') + '</div>';
    });
    h += '<p class="lille" style="margin:10px 0 0;'+(mine.length>3?'color:var(--guld);font-weight:700':'font-style:italic')+'">' +
      (mine.length>3
        ? '\u26a0\ufe0f ' + mine.length + ' valgt. Tre er det, en spiller kan huske på vej ind til kampen \u2014 \u00e9n pr. farve.'
        : mine.length + ' af 3 valgt \u00b7 faste valg, ingen fritekst \u2014 hurtigere p\u00e5 banen, og analysen kan regne p\u00e5 dem.') + '</p>';
  }
  h += '</div>';
  h += faellesLag(s);
  // Vurdering pr. område (score + tekst)
  h += '<div class="kort"><h3>📋 Seneste vurdering pr. område</h3>';
  KONFIG.omraader.forEach(function(o){
    const v = (s.vurdering||{})[o.id]; if (!v) return;
    const b = skala(v.score);
    h += '<div style="border-top:1px solid var(--kant);padding:10px 0"><div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">' +
      '<span style="width:13px;height:13px;border-radius:50%;background:'+b.farve+';flex:none"></span>' +
      '<b style="font-size:13px">'+o.emoji+' '+esc(o.navn)+'</b>' +
      '<span style="margin-left:auto;font-size:12px;font-weight:800;color:'+b.farve+'">'+v.score+'/10</span></div>' +
      '<p style="font-size:12px;color:var(--daempet);margin:0 0 0 21px;line-height:1.5">'+esc(v.tekst)+'</p></div>';
  });
  h += '</div>';
  // Data-drevet fokus: svageste område
  const omr = KONFIG.omraader.filter(o=>(s.vurdering||{})[o.id]);
  if (omr.length){
    const svag = omr.slice().sort((a,b)=>s.vurdering[a.id].score - s.vurdering[b.id].score)[0];
    h += '<div class="kort" style="border-left:3px solid var(--grus)"><div class="eyebrow" style="color:var(--grus)">🎯 DATA-DREVET FOKUS</div>' +
      '<p style="margin:6px 0 0;font-size:13px">Laveste score er <b>'+svag.emoji+' '+esc(svag.navn)+'</b> ('+s.vurdering[svag.id].score+'/10). Sæt træningsfokus her — og følg med i spillerens kamp-app, om det flytter sig.</p></div>';
  }
  return h;
}
function mini(label,v){ return '<div style="background:var(--nat);border-radius:10px;padding:10px 12px"><div style="font-size:19px;font-weight:800">'+v+'</div><div class="lille">'+label+'</div></div>'; }

function passIKvartalet(s) {
  // trResume er højst 12 uger (backend-loftet) — altså et kvartal.
  if (s && Array.isArray(s.trResume) && s.trResume.length)
    return s.trResume.reduce(function(a, w){ return a + (w.t || 0) + (w.f || 0); }, 0);
  return (s && s.traeningerKvartal) || 0;
}

function miniIkon(label, v, ikon){
  return '<div style="background:var(--nat);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px">' +
    '<span style="flex:none;display:flex">' + ikon + '</span>' +
    '<div style="min-width:0"><div style="font-size:19px;font-weight:800">' + v + '</div><div class="lille">' + label + '</div></div></div>';
}
function miniRing(label, pct){
  const p = Math.max(0, Math.min(100, +pct || 0));
  const O = 2 * Math.PI * 14.5;               // omkreds ved r=14,5
  const arc = (p / 100) * O;
  return '<div style="background:var(--nat);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px">' +
    '<svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true" style="flex:none">' +
    '<circle cx="19" cy="19" r="14.5" fill="none" stroke="var(--kant)" stroke-width="4.5"/>' +
    (p > 0 ? '<circle cx="19" cy="19" r="14.5" fill="none" stroke="var(--guld)" stroke-width="4.5" stroke-linecap="round" ' +
      'stroke-dasharray="' + arc.toFixed(1) + ' ' + O.toFixed(1) + '" transform="rotate(-90 19 19)"/>' : '') +
    '</svg>' +
    '<div style="min-width:0"><div style="font-size:19px;font-weight:800">' + p + '%</div><div class="lille">' + label + '</div></div></div>';
}

function faellesLag(s){
  if (!s.kampliste || !s.kampliste.length) return "";
  const st = s.statistik || {};
  let h = '<div class="kort" style="border-left:3px solid var(--is)"><div class="eyebrow" style="color:var(--is)">\ud83d\udd17 F\u00c6LLES LAG \u2014 FRA KAMP-APP\u0027EN</div>';
  // Fuld statistik
  h += '<div class="grid2" style="margin-top:8px">' +
    mini("Point vundet", (st.pointPct||0)+"%") +
    mini("Vindere", (st.vindere||0)+" (heraf "+(st.esser||0)+" es)") +
    mini("Gratis fejl", (st.uf||0)+" (heraf "+(st.dobbelt||0)+" db)") +
    mini("Vindere \u2212 fejl", (st.diff>0?"+":"")+(st.diff||0)) + '</div>';
  // Kamp-for-kamp søjler (vindere + fejl pr. kamp)
  const soejleRk = function(label, vals, farve){
    const mx = Math.max.apply(null, vals.concat([1]));
    return '<div style="font-size:10.5px;color:var(--daempet);margin:9px 0 2px">'+label+' \u2014 kamp for kamp (\u00e6ldste \u2192 nyeste)</div>' +
      '<div style="display:flex;align-items:flex-end;gap:3px;height:30px">' +
      vals.map(function(v,i){ return '<span style="flex:1;max-width:16px;border-radius:2px 2px 0 0;background:'+farve+';opacity:'+(i===vals.length-1?'1':'.65')+';height:'+Math.max(3,Math.round(v/mx*30))+'px'+(i===vals.length-1?';outline:1.5px solid var(--kridt)':'')+'"></span>'; }).join("") + '</div>';
  };
  h += soejleRk("Vindere", s.kampliste.map(function(k){return k.vin;}), "var(--vundet)");
  h += soejleRk("Gratis fejl", s.kampliste.map(function(k){return k.uf;}), "var(--tabt)");
  // Alle kampe
  h += '<h3 style="margin:12px 0 4px">\ud83c\udfbe Alle kampe ('+s.kampliste.length+')</h3>';
  s.kampliste.slice().reverse().forEach(function(k){
    h += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--kant);font-size:12px">' +
      '<span style="font-weight:800;width:14px;color:'+(k.v?'var(--vundet)':'var(--tabt)')+'">'+(k.v?'V':'T')+'</span>' +
      '<span style="flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(k.mod)+'</span>' +
      '<span style="color:var(--daempet);flex:none">'+esc(k.res)+'</span>' +
      '<span style="color:var(--daempet);flex:none;font-size:10.5px">'+esc(k.dato.slice(5))+'</span></div>';
  });
  // Pr. modstander
  if (s.rivaler){
    h += '<h3 style="margin:12px 0 4px">\ud83c\udfaf Pr. modstander</h3><div>';
    Object.keys(s.rivaler).forEach(function(mod){
      const r = s.rivaler[mod];
      h += '<span style="display:inline-block;background:var(--nat);border-radius:9px;padding:4px 9px;margin:2px 4px 2px 0;font-size:11.5px"><b>'+esc(mod.split(" ").pop())+'</b> <span style="color:'+(r.v*2>=r.k?'var(--vundet)':'var(--tabt)')+';font-weight:800">'+r.v+'-'+(r.k-r.v)+'</span></span>';
    });
    h += '</div>';
  }
  // Sæson
  if (DATA.saeson && DATA.saeson.length){
    h += '<h3 style="margin:12px 0 4px">\ud83d\udcc5 S\u00e6son</h3>';
    DATA.saeson.forEach(function(e){ h += '<p class="lille" style="margin:3px 0">'+esc(e)+'</p>'; });
  }
  h += '<p class="lille" style="margin-top:8px">Samme tal hos spiller og tr\u00e6ner. Den fulde motor-analyse (serveprocenter, breakbolde, benchmark-sammenligning) bor i spillerens kamp-app \u2014 med backend spejles den 1:1 her.</p></div>';
  return h;
}
// ---------- HURTIG VURDERING ----------
function traenerVurder(t){
  if (!S.vurderOmraade){
    // UGENS FOKUS er flyttet hertil som en selvstændig kategori. Den hører
    // hjemme i vurderingsflowet, ikke på forsiden: fokus sættes lige før man
    // vurderer, og hver vurdering kobles til det.
    const uf = ugensFokus();
    let h = '<p class="lille" style="margin-bottom:2px">Hvad trænede du? Vælg område — så giver du hver spiller en score på farveskalaen med ét tryk.</p>';

    h += '<div class="dev-grid">';
    h += '<button class="dev-flise dev-kant-guld" data-act="vurder-omraade" data-v="__fokus">' +
      '<span class="ik">⚡</span><b>UGENS FOKUS</b><small>' +

          : 'ikke valgt endnu') + '</small></button>';

      h += '<button class="dev-flise dev-kant-is" data-act="vurder-omraade" data-v="'+o.id+'">' +

  // ── UGENS FOKUS · egen skærm med fire lige store fliser
  if (S.vurderOmraade === "__fokus"){
    const valgt = ugensFokus();

    h += '<div class="dev-grid">' +
      UGEOMRAADER.map(o => '<button class="dev-flise fokus-flise' + (valgt===o.id ? ' valgt' : '') +
        '" data-act="saet-ugefokus" data-v="' + o.id + '">' +
        '<span class="ik">' + o.ikon + '</span><b>' + o.navn.toUpperCase() + '</b>' +
        '<small>' + (valgt===o.id ? 'ugens fokus' : 'vælg som fokus') + '</small></button>').join('') + '</div>';
    if (valgt) h += '<div class="kort" style="border-left:3px solid var(--guld);margin-top:12px">' +
      '<p class="lille" style="margin:0">Alle vurderinger denne uge kobles til <b>' +
      UGEOMRAADER.find(o=>o.id===valgt).navn.toLowerCase() + '</b>. Tryk igen for at fjerne.</p></div>';
    return h;
  }

  if (!S.vurderGruppe){
    let h = '<button class="knap valg" style="margin-bottom:10px;flex:none;padding:8px 14px" data-act="luk-omraade">‹ Skift område</button>';
    h += '<p class="lille">'+OMRNAVN[S.vurderOmraade].emoji+' '+esc(OMRNAVN[S.vurderOmraade].navn)+' — vælg gruppe:</p>';
    h += '<div class="dev-grid">';
    t.grupper.forEach(function(g){
      h += '<button class="dev-flise dev-kant-is" data-act="vurder-gruppe" data-v="'+esc(g)+'">' +
        '<span class="ik">👥</span><b>'+esc(g.toUpperCase())+'</b>' +
        '<small>'+DATA.grupper[g].spillere.length+' spillere</small></button>';
    });
    h += '</div>';
    return h;
  }
  const sp = DATA.grupper[S.vurderGruppe].spillere;
  const done = sp.filter(n => S.vurderScores[n]).length;
  let h = '<button class="knap valg" style="margin-bottom:10px;flex:none;padding:8px 14px" data-act="luk-gruppe">‹ '+esc(S.vurderGruppe)+'</button>';
  h += '<div class="kort" style="padding:11px 14px"><div style="display:flex;justify-content:space-between;align-items:center">' +
    '<div><div class="eyebrow">'+OMRNAVN[S.vurderOmraade].emoji+' '+esc(OMRNAVN[S.vurderOmraade].navn).toUpperCase()+'</div><h3 style="margin:2px 0 0">Dagens indsats</h3></div>' +
    '<div style="text-align:right"><div style="font-size:18px;font-weight:800">'+done+'/'+sp.length+'</div><div class="lille">færdig</div></div></div>' +
    '<p class="lille" style="margin-top:6px">Ét tryk pr. spiller på farveskalaen — under 20 sek. i alt.</p></div>';
  sp.forEach(function(n){
    const s = DATA.spillere[n], valgt = S.vurderScores[n];
    h += '<div class="kort" style="padding:11px 13px"><div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">' +
      '<div class="avatar" style="width:28px;height:28px;font-size:11px;'+(s.erBruger?'background:var(--is);color:var(--nat)':'')+'">'+init(n)+'</div>' +
      '<div style="flex:1;font-size:13px;font-weight:700">'+esc(n)+'</div>' +
      (function(){
        // Dagens tidligere pas vises, så tælleren aldrig lyver om dagen (19/8).
        const idag = new Date().toISOString().slice(0,10);
        const dv = S.vurderinger.filter(function(x){ return x.spiller===n && x.omraade===S.vurderOmraade && x.dato===idag; });
        if (!dv.length) return '';
        return '<span class="lille" style="flex:none">I dag: ' +
          dv.map(function(x){ return '<b style="color:'+skala(x.score).farve+'">'+x.score+'</b>'; }).join(' · ') + '</span>';
      })() + '</div>' +
      '<div style="display:flex;gap:7px;justify-content:space-between">';
    KONFIG.farveskala.forEach(function(b){
      const on = valgt === b.max;
      h += '<div class="dot'+(on?' valgt':'')+'" style="background:'+b.farve+';color:'+b.farve+'" data-act="score" data-sp="'+esc(n)+'" data-v="'+b.max+'"><span style="color:#fff;font-size:9px">'+b.min+'-'+b.max+'</span></div>';
    });
    h += '</div></div>';
  });
  if (done===sp.length && done>0){
    h += '<div class="kort" style="border:1.5px solid var(--vundet);text-align:center"><h3 style="color:var(--vundet);margin:0">✓ Passet er gemt!</h3>' +
      '<p class="lille" style="margin:4px 0 0">Hvert pas gemmes for sig i spillernes historik. Ved rundens slut samler AI det til en evaluering.</p>' +
      '<div class="raekke" style="margin-top:9px;justify-content:center"><button class="knap valg" style="flex:none;padding:8px 14px" data-act="nyt-pas">➕ Vurdér et nyt pas</button></div></div>';
  }
  return h;
}
function skalaForklaring(){
  let h = '<div class="kort" style="margin-top:4px"><div class="eyebrow">FARVESKALA</div>';
  KONFIG.farveskala.forEach(function(b){
    h += '<div class="skala-band"><span class="skala-cirkel" style="background:'+b.farve+';color:'+b.farve+'"></span><b>'+b.min+'-'+b.max+'</b> = '+esc(b.label)+'</div>';
  });
  h += '</div>';
  return h;
}

// ---------- EVALUERING (kvartals, mail-format) ----------
function traenerKvartal(t){
  const alleSp = []; t.grupper.forEach(g => DATA.grupper[g].spillere.forEach(n => alleSp.push(n)));
  if (!S.kvartalUdkast){
    let h = '<p class="lille">AI samler rundens scores og noter til en evaluering pr. spiller — i klubbens format. Du retter og godkender, så sendes den til spilleren.</p>';
    if (S.syncBesked) h += '<p class="lille" style="margin:0 2px 8px;color:' + (S.syncBesked.fejl?'var(--tabt)':'var(--vundet)') + '">' + esc(S.syncBesked.t) + '</p>';
    alleSp.forEach(function(n){
      const s = DATA.spillere[n];
      h += '<div class="kort" style="display:flex;align-items:center;gap:10px">' +
        '<div class="avatar" style="width:30px;height:30px;font-size:12px;'+(s.erBruger?'background:var(--is);color:var(--nat)':'')+'">'+init(n)+'</div>' +
        '<div style="flex:1"><div style="font-size:13.5px;font-weight:700">'+esc(n)+'</div><div class="lille">'+passIKvartalet(s)+' træninger · '+s.kampe+' kampe</div></div>' +
        '<button class="knap" style="flex:none;padding:8px 12px;font-size:12.5px" data-act="kvartal-gen" data-v="'+esc(n)+'"><span class="badge-ai">AI</span> '+(((S.evalueringer||{})[n])?'Ny':'Generér')+'</button>' +
        (((S.evalueringer||{})[n]) ? '<button class="knap valg" style="flex:none;padding:8px 10px;font-size:12.5px" data-act="eval-del" data-v="'+esc(n)+'">\ud83d\udce4</button>' : '') +
        '</div>';
    });
    return h;
  }
  const n = S.kvartalUdkast, s = DATA.spillere[n], fornavn = n.split(" ")[0];
  if (S.kvartalHenter) {
    return '<button class="knap valg" style="margin-bottom:10px;flex:none;padding:8px 14px" data-act="luk-kvartal">‹ Alle spillere</button>' +
      '<div class="kort" style="text-align:center"><h3 style="margin:0">⏳ Udkastet skrives …</h3>' +
      '<p class="lille" style="margin:6px 0 0">Rundens pas-scores, kampe og træningstal samles til et udkast — cirka 20 sekunder. Du retter og godkender bagefter.</p></div>';
  }
  let tekst;
  if (S.kvartalAI) {
    tekst = S.kvartalAI;
  } else {
    // Fald-tilbage: den lokale skabelon (som før AI-koblingen 19/8)
    tekst = "Hej "+fornavn+"\n\nHermed evaluering fra "+KONFIG.maaned+" "+KONFIG.saeson+"\n\nSpiller: "+n+"\nTræner: "+t.navn+"\n";
    KONFIG.omraader.forEach(function(o){
      const v = (s.vurdering||{})[o.id]; if (!v) return;
      const b = skala(v.score);
      tekst += "\n"+o.navn+"\n"+b.emoji+" "+b.min+"-"+b.max+" = "+b.label+". "+v.tekst+"\n";
    });
  }
  S.kvartalTekst = tekst;
  let h = '<button class="knap valg" style="margin-bottom:10px;flex:none;padding:8px 14px" data-act="luk-kvartal">‹ Alle spillere</button>';
  h += '<div class="kort"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="badge-ai">' + (S.kvartalAI ? 'AI-UDKAST' : 'SKABELON') + '</span><h3 style="margin:0">'+esc(n)+'</h3></div>' +
    (S.kvartalNote ? '<p class="lille" style="margin:0 0 6px;color:var(--guld)">' + esc(S.kvartalNote) + '</p>' : '') +
    '<p class="lille">' + (S.kvartalAI
      ? 'Bygget af rundens pas-scores, kampe og træningstal. Det er DIT udkast — ret frit, godkend derefter.'
      : 'Samlet fra scores + noter i klubbens format. Ret frit, godkend derefter.') + '</p>' +
    '<textarea id="evalTekst" rows="16">'+esc(tekst)+'</textarea>' +
    '<div class="raekke" style="margin-top:10px"><button class="knap valg" data-act="luk-kvartal">Kassér</button>' +
    '<button class="knap til" data-act="kvartal-godkend">✓ Godkend & send</button></div></div>';
  return h;
}

// ---------- SPILLER ----------

// ---------- EVENTS ----------
document.addEventListener("input", function(e){ var f = e.target.dataset && e.target.dataset.felt; if (f) S[f] = e.target.value; });
document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, v = t.dataset.v;
  if (act==="ops-aabn"){ S.opsAaben = !S.opsAaben; S.kkUdkast = lager.hent("klubkode",""); render(); }
  else if (act==="ops-gem"){
    lager.gem("klubkode", (S.kkUdkast||"").trim()); S.opsAaben=false;
    S.syncBesked = { fejl:false, t:"Klubkoden er gemt på denne enhed ✓" }; render(); }
  else if (act==="noegle-aabn"){ S.noegleFor = (S.noegleFor===v?null:v); S.noegleUdkast = (S.noegler||{})[v]||""; render(); }
  else if (act==="noegle-gem"){
    const sp = t.dataset.sp; const n = (S.noegleUdkast||"").trim();
    S.noegler = S.noegler || {};
    if (n) S.noegler[sp] = n; else delete S.noegler[sp];
    lager.gem("noegler", S.noegler); S.noegleFor = null; render();
    if (n) sendVurdering(sp); }
  else if (act==="saet-ugefokus"){
    S.ugefokus[ugeNoegle()] = (S.ugefokus[ugeNoegle()] === v ? null : v);
    lager.gem("ugefokus", S.ugefokus); render();
    if (S.ugefokus[ugeNoegle()]) sync("saet-ugefokus", { uge: ugeNoegle(), omraade: v }); }
  else if (act==="fp-aabn"){ S.fpAaben = (S.fpAaben === v ? null : v); render(); }
  else if (act==="fp-slaa"){
    const sp = t.dataset.sp;
    const nu = S.fokuspunkter[sp] || [];
    S.fokuspunkter[sp] = nu.includes(v) ? nu.filter(x => x !== v) : nu.concat([v]);
    lager.gem("fokuspunkter", S.fokuspunkter); render(); sendVurdering(sp); }
  if (act==="tab"){ S.tab=v; S.aabenSpiller=null; S.vurderOmraade=null; S.vurderGruppe=null; S.kvartalUdkast=null; render(); }
  else if (act==="spiller-detalje"){ S.aabenSpiller=v; render(); }
  else if (act==="luk-spiller"){ S.aabenSpiller=null; render(); }
  else if (act==="vurder-omraade"){ S.vurderOmraade=v; S.vurderScores = {}; render(); }
  else if (act==="luk-omraade"){ S.vurderOmraade=null; S.vurderGruppe=null; render(); }
  else if (act==="vurder-gruppe"){ S.vurderGruppe=v; render(); }
  else if (act==="luk-gruppe"){ S.vurderGruppe=null; render(); }
  else if (act==="score"){
    const sp = t.dataset.sp;
    const idag = new Date().toISOString().slice(0,10);
    // HÆNDELSE, ikke celle (19/8, flow-designet): to pas samme dag må ALDRIG
    // overskrive hinanden. Et gen-tryk i SAMME pas retter dog blot scoren —
    // en glidende finger skal ikke blive til to hændelser.
    let rettet = false;
    if (S.vurderScores[sp] !== undefined) {
      for (let j = S.vurderinger.length - 1; j >= 0; j--) {
        const x = S.vurderinger[j];
        if (x.spiller === sp && x.omraade === S.vurderOmraade && x.dato === idag) {
          x.score = +v; x.fokus = ugensFokus(); rettet = true; break;
        }
      }
    }
    if (!rettet) S.vurderinger.push({ dato: idag, spiller: sp,
                                      omraade: S.vurderOmraade, score: +v, fokus: ugensFokus() });
    S.vurderScores[sp] = +v;
    lager.gem("vurderinger", S.vurderinger);
    render();
    sendVurdering(sp); }
  else if (act==="nyt-pas"){ S.vurderScores = {}; render(); }
  else if (act==="kvartal-gen"){ hentEvalUdkast(v); }
  else if (act==="luk-kvartal"){ S.kvartalUdkast=null; render(); }
  else if (act==="kvartal-godkend"){ const n=S.kvartalUdkast; const ta=el("evalTekst"); const tekst=(ta&&ta.value)||S.kvartalTekst||""; const d=DATA.spillere[n]; if(d){ d.evalSendt=tekst; d.evalNy=true; } S.evalueringer=S.evalueringer||{}; S.evalueringer[n]={tekst:tekst,dato:new Date().toISOString().slice(0,10)}; lager.gem("evalueringer", S.evalueringer);
    // v2.5 (18/8): har spilleren en NØGLE, sendes evalueringen RIGTIGT til
    // spillerens app via evaluering-gem. Uden nøgle er det demo-flowet som før.
    var _noegle = (S.noegler||{})[n];
    if (_noegle) {
      sync("evaluering-gem", Object.assign(spillerRef(_noegle), { dato: S.evalueringer[n].dato, tekst: tekst, af: S.traener || null }))
        .then(function(r){
          S.syncBesked = (r && r.fejl)
            ? { fejl: true, t: "Evalueringen er gemt HER, men kunne ikke n\u00e5 spillerens app: " + r.fejl }
            : { fejl: false, t: "\u2713 Evalueringen er sendt til " + n.split(" ")[0] + "s app" };
          render();
        })
        .catch(function(){ S.syncBesked = { fejl: true, t: "Evalueringen er gemt HER, men netv\u00e6rket svigtede \u2014 pr\u00f8v Godkend & send igen." }; render(); });
    } else {
      alert("\u2713 Evalueringen er gemt her p\u00e5 enheden.\n\nSpilleren har ingen n\u00f8gle endnu \u2014 f\u00f8j n\u00f8glen til under \ud83d\udc65 MIN TRUP, og tryk Godkend & send igen, s\u00e5 lander den i spillerens app.");
    }
    S.kvartalUdkast=null; render(); }
  else if (act==="rejse-naeste"){
    var ri = Math.min(S.rejse.trin || 0, 2), rf = ["rejseNavn","rejseKlub","rejseSpiller"][ri];
    var rv = (S[rf]||"").trim();
    if (!rv) { S.syncBesked = { fejl:true, t:"Skriv noget først." }; render(); return; }
    if (rv.length > 40) { S.syncBesked = { fejl:true, t:"Højst 40 tegn." }; render(); return; }
    if (ri === 0) { S.traener = rv; if (DATA.traenere && DATA.traenere[0]) DATA.traenere[0].navn = rv;
      lager.gem("traenernavn", rv); }
    // ⭐⭐⭐ v3.4.0 · KODEN TJEKKES, FØR DER FEJRES.
    //   Før stod der «Forbundet», uanset hvad der blev tastet.
    if (ri === 1) {
      lager.gem("klubkode", rv);
      S.rejseTjekker = true; S.syncBesked = null; render();
      noegleKald("liste", {}).then(function (r) {
        S.rejseTjekker = false;
        var f = r && r.fejl;
        if (f === "adgang") {
          // Nøglen kendes ikke, er spærret eller udløbet. Den gemmes IKKE.
          try { lager.gem("klubkode", ""); } catch (_e) {}
          S.syncBesked = { fejl: true, t: "Den kode kender vi ikke \u2014 tjek den, eller spring over og tast den senere." };
          render(); return;
        }
        if (f === "kraever-traener") {
          // ⭐ En SPILLERnøgle. Den hører til i StreakTennis, ikke her —
          //   og det er en meget nem fejl at lave med to nøgler i lommen.
          try { lager.gem("klubkode", ""); } catch (_e) {}
          S.syncBesked = { fejl: true, t: "Det er en spillernøgle \u2014 den hører hjemme i StreakTennis-appen. Her skal klubbens træner- eller cheftrænernøgle bruges." };
          render(); return;
        }
        S.minRolle = (r && r.rolle) || null;
        var kendt = !f && r && r.rolle;
        S.rejseFest = {
          ikon: kendt ? "\ud83d\udd17" : "\ud83d\udcf1",
          h: r && r.rolle === "admin" ? "Forbundet som cheftræner"
           : r && r.rolle === "traener" ? "Forbundet som træner"
           : "Koden er gemt",
          u: kendt
            ? ("Du er koblet på " + (r.klub || "klubben") + ". Dine vurderinger kan nu nå frem til spillerne."
               + (r.rolle === "admin" ? " Du kan udstede både træner- og spillernøgler." : " Du kan udstede spillernøgler til familierne."))
            : "Vi kunne ikke tjekke koden lige nu \u2014 den er gemt, og platformen prøver igen af sig selv.",
          sidste: false };
        render();
      }).catch(function () {
        // ⚠️ PRINCIP 35: knappen svarer ALTID. Et brud her måtte aldrig
        //   efterlade træneren på en skærm, der ikke rører sig.
        S.rejseTjekker = false;
        S.rejseFest = { ikon: "\ud83d\udcf1", h: "Koden er gemt",
          u: "Vi kunne ikke tjekke den lige nu \u2014 platformen prøver igen af sig selv.", sidste: false };
        render();
      });
      return;
    }
    if (ri === 2) { S.truppen = S.truppen || [];
      S.truppen.push({ navn: rv, gruppe: "Mit hold", noegle: "" });
      lager.gem("truppen", S.truppen); byggTrup(); }
    var RT = REJSE_TRIN[ri];
    S.rejseFest = { ikon: RT.festIkon, h: RT.festH(rv), u: RT.festU, sidste: ri === 2 };
    S.syncBesked = null; render(); }
  else if (act==="rejse-spring"){
    // Uden klubkode roerer appen INTET udefra — sync() stopper paa "mangler-klubkode".
    // Alt bliver paa traenerens egen telefon. Det er den tilstand, en klub kan
    // proeve platformen i, FOER pilotaftalen er underskrevet.
    S.rejseFest = { ikon: "\ud83d\udcf1", h: "Alt bliver hos dig",
      u: "Ingen data forlader din telefon, før du taster klubkoden ind. Du finder feltet under Indstillinger, når du har fået koden.",
      sidste: false };
    S.syncBesked = null; render(); }
  else if (act==="rejse-tilbage"){
    // ⭐ v3.4.0 · Ét skridt tilbage. Feltet står med det, der blev tastet,
    //   så man kan RETTE — ikke skrive forfra.
    S.rejseFest = null; S.syncBesked = null;
    S.rejse.trin = Math.max(0, (S.rejse.trin || 0) - 1);
    lager.gem("rejse", S.rejse);
    try { window.scrollTo(0, 0); } catch (_e) {}
    render(); }
  else if (act==="rejse-videre"){
    S.rejseFest = null;
    S.rejse.trin = (S.rejse.trin || 0) + 1;
    if (S.rejse.trin >= 3) { S.rejse.faerdig = true; S.tab = "hjem"; }
    lager.gem("rejse", S.rejse); render(); }
  else if (act==="tilm-hent"){ hentTilmeldinger(); }
  else if (act==="fam-udsted"){
    if (S.famUdsteder) return;
    if (!lager.hent("klubkode","")) { S.famBesked={fejl:true,t:"Indtast klubkoden f\u00f8rst."}; render(); return; }
    S.famUdsteder = true; S.famBesked = null; render();
    var _etk = (S.famEtiket||"").trim();
    // ⭐ v3.4.0 · `v` baerer rollen: tom/"spiller" = familie, "traener" =
    //   en traener. Kun en ADMIN faar 200 paa den sidste (motoren doemmer,
    //   ikke skaermen — knappen vises bare ikke for andre).
    var _rolle = (v === "traener") ? "traener" : "spiller";
    noegleKald("udsted", Object.assign({ rolle: _rolle }, _etk ? { etiket: _etk } : {})).then(function(r){
      S.famUdsteder = false;
